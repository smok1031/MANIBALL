<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매니볼 | 정기 점검 중</title>
<meta name="theme-color" content="#14182B">
<meta name="robots" content="noindex">
<script src="maint-config.js?v=__VER__"></script>
<script src="maint-gate.js?v=__VER__"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F0EEE9}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,.sc::-webkit-scrollbar{display:none;width:0;height:0}
body{color:#14182B;font-family:'IBM Plex Sans KR',sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body *{-webkit-user-drag:none}
.sc{scrollbar-width:none;-ms-overflow-style:none}
.drag{cursor:grab}
.wrap{max-width:430px;margin:0 auto;padding:20px 20px 32px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:11px;background:#5B8DEF;border:2px solid #14182B;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bname{display:flex;flex-direction:column;line-height:1}
.bname b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:22px}
.bname span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;color:#4A4F63;margin-top:3px}
.tk{border:2px solid #14182B;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.tk-top{background:#14182B;color:#F0EEE9;display:flex;flex-direction:column;gap:10px;padding:22px 20px 20px}
.kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:3px;color:#9FB8F5;font-size:14px}
.h1{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;line-height:1.15;font-size:32px}
.when{align-self:flex-start;border:2px solid #F0EEE9;border-radius:8px;padding:5px 10px;font-weight:700;font-size:14px}
.tk-stub{border-top:2px dashed #14182B;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;min-height:72px}
.tk-stub .lb{font-size:14px;font-weight:700}
.tk-stub .v{display:flex;align-items:baseline;gap:4px;font-size:15px;font-weight:700}
.tk-stub .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1;font-size:40px}
.muted{margin:0;color:#4A4F63;line-height:1.65;font-size:14px}
.h2{margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h2 b{font-size:18px}
.h2 span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:#4A4F63}
.list{display:flex;flex-direction:column;gap:12px}
.ch{border:2px solid #14182B;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#F0EEE9;flex-shrink:0}
.ch-h{display:flex;align-items:baseline;gap:10px;padding:12px 16px 10px}
.ch-h .no{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:#4A4F63}
.ch-h b{font-size:16px}
.ch-b{background:#DCD8CF;padding:10px 16px 12px;display:flex;flex-direction:column;gap:4px;border-top:2px solid #14182B}
.ch-a{padding:10px 16px 14px;display:flex;flex-direction:column;gap:4px;border-top:2px dashed #14182B}
.tag{align-self:flex-start;font-size:12px;font-weight:700;border:1.5px solid #14182B;border-radius:6px;padding:0 7px}
.tag.a{background:#14182B;color:#F0EEE9}
.ch-b .tx{font-size:14px;line-height:1.55;color:#4A4F63}
.ch-a .tx{font-size:15px;line-height:1.55;font-weight:500}
.more{min-height:52px;border:2px solid #14182B;border-radius:12px;background:#F0EEE9;color:#14182B;font:700 15px 'IBM Plex Sans KR',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;width:100%}
.more:focus-visible{outline:3px solid #5B8DEF;outline-offset:2px}
.unsaved{border:2px solid #14182B;border-radius:14px;background:#E46A2E;color:#14182B;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.5;flex-shrink:0}
[hidden]{display:none!important}
.pc{display:none}
/* PC: 왼쪽 점검 표, 오른쪽 바뀌는 것 (오른쪽만 안에서 내림) */
@media (min-width:900px){
  html,body{height:100%;overflow:hidden}
  .wrap{max-width:1120px;height:100%;padding:0 40px;gap:0}
  .top{height:80px;display:flex;align-items:center;flex:none}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.1fr;gap:48px;padding:16px 0 40px}
  .left{display:flex;flex-direction:column;gap:22px}
  .right{min-height:0;display:flex;flex-direction:column;gap:14px}
  .right .list{flex:1;min-height:0;overflow-y:auto;padding:0 0 6px}
  .tk{box-shadow:6px 6px 0 #5B8DEF}
  .tk-top{padding:34px 32px 30px;gap:14px}
  .kick{font-size:16px}
  .h1{font-size:52px}
  .when{font-size:16px}
  .tk-stub{padding:18px 32px}
  .tk-stub .lb{font-size:16px}
  .tk-stub .v{font-size:17px;gap:6px}
  .tk-stub .n{font-size:56px}
  .muted{font-size:16px}
  .h2 b{font-size:20px}
  .mo{display:none}
  .pc{display:inline}
}
@media (max-width:899px){.grid,.left,.right{display:contents}.top{display:contents}}
</style>
</head>
<body>
<main class="wrap" id="scrollMo">
  <div class="top"><div class="brand"><span class="mark" role="img" aria-label="매니볼"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#14182B" stroke-width="5"></circle><circle cx="23" cy="26" r="3.6" fill="#E46A2E"></circle><circle cx="23" cy="38" r="3.6" fill="#E46A2E"></circle><path d="M30 26 H43 M30 38 H41" fill="none" stroke="#14182B" stroke-width="5" stroke-linecap="round"></path></svg></span><span class="bname"><b>매니볼</b><span>MANIBALL</span></span></div></div>
  <div class="grid">
    <div class="left">
      <section class="tk" aria-labelledby="ttl">
        <div class="tk-top">
          <span class="kick">MAINTENANCE</span>
          <h1 class="h1" id="ttl">지금은 정기 점검<br class="pc"> 중이에요</h1>
          <span class="when" id="win">업로드하는 동안 잠시 멈춰요</span>
        </div>
        <div class="tk-stub" aria-live="polite">
          <span class="lb" id="leftLb">다시 열리기까지</span>
          <span class="v" id="leftBox" hidden><span>약</span><span class="n" id="left">-</span><span>분</span></span>
        </div>
      </section>
      <p class="muted"><span class="mo">점검하는 동안에는 매니볼을 쓸 수 없어요.</span><span class="pc">점검하는 동안에는 매니볼 홈페이지와 앱을 쓸 수 없어요.</span> 점검 전에 저장한 내용은 그대로 있어요. 점검이 끝나면 이 화면에서 바로 다시 열려요. 시간은 한국 시간이에요.</p>
      <div class="unsaved" id="unsaved" role="status" hidden><b>점검 시작 직전에 누른 것 <span id="unsavedN">1</span>건은 저장되지 않았어요.</b><span>다시 열리면 한 번 더 눌러 주세요.</span></div>
    </div>
    <div class="right">
      <h2 class="h2"><b>이번 점검에서 바뀌는 것</b><span id="total"></span></h2>
      <div class="list sc" id="notes"></div>
    </div>
  </div>
</main>
<script src="maint.js?v=__VER__"></script>
</body>
</html>
