<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매니볼 | 정기 점검 중</title>
<meta name="theme-color" content="#1E6B45">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F7F9;color:#111827;font-family:'Noto Sans KR',sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:#1E6B45;display:inline-flex;align-items:center;justify-content:center;flex:none}
.hero{background:#FFFFFF;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.hero h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.6px}
.when{display:inline-flex;align-self:flex-start;background:#F0FDF4;color:#166534;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.muted{color:#6B7280;font-size:14px;line-height:1.6}
h2{margin:10px 4px 0;font-size:17px}
.card{background:#FFFFFF;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.t{font-size:16px}
.ba{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55}
.tag{flex:none;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-top:1px}
.tag.b{background:#F3F4F6;color:#4B5563}.tag.a{background:#DCFCE7;color:#166534}
</style>
<script src="maint-gate.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo" role="img" aria-label="매니볼"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#FFFFFF" stroke-width="5"></circle><circle cx="23" cy="26" r="3.5" fill="#F5B841"></circle><circle cx="23" cy="38" r="3.5" fill="#F5B841"></circle><path d="M30 26 H43 M30 38 H41" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></path></svg></span><b style="font-size:20px;font-weight:900">매니볼</b></div>
  <div class="hero">
    <h1>지금은 정기 점검 중이에요</h1>
    <span class="when" id="win">매주 수요일 04:00~05:00 (한국 시간)</span>
    <span class="muted">점검하는 동안에는 매니볼을 쓸 수 없어요. 점검이 끝나면 이 화면에서 바로 다시 열려요.</span>
    <span class="muted" id="left"></span>
  </div>
  <h2>이번 점검에서 바뀌는 것</h2>
  <div id="notes" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
<script src="maint.js"></script>
</body>
</html>
