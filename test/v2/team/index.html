<style>
/* 17안: 네오브루탈리즘. 종이 바탕(#FBF7EF)에 16px 모눈, 글자와 선은 먹색(#121110), 카드는 흰 바탕에 2px 선과 4px 그림자.
   탭마다 색 한 벌(진한색, 중간색, 옅은색, 글자색): 홈 파랑, 일정 청록, 기록 분홍, 팀 초록, 운영 보라. 누를 곳은 노랑(#FCD01A) */
:root{--bg:#FBF7EF;--ink:#121110;--sub:#5B5650;--line:#DDD6C8;--mute:#9C9488;--gray:#FFFFFF;--white:#FFFFFF;--yel:#FCD01A;--danger:#8C3B28;
  --blue:#CDDFFF;--orange:#FCD01A;--green:#C8E8CD;--pink:#FDD1D8;--clay:#FFECEF;--teal:#121110;
  --sec:#7CA4F0;--sec2:#CDDFFF;--sec3:#EAF2FF;--sect:#304773;--grid:linear-gradient(rgba(18,17,16,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,17,16,.06) 1px,transparent 1px);--sh:4px 4px 0 var(--ink)}
:root[data-sec="schedule"]{--sec:#14BBC2;--sec2:#B8E9EB;--sec3:#E2F7F8;--sect:#005459}
:root[data-sec="record"]{--sec:#E48398;--sec2:#FDD1D8;--sec3:#FFECEF;--sect:#6B3440}
:root[data-sec="team"]{--sec:#69BA7C;--sec2:#C8E8CD;--sec3:#E8F6EA;--sect:#235430}
:root[data-sec="ops"]{--sec:#B093E5;--sec2:#DCCDF6;--sec3:#F4EFFF;--sect:#4A3577}
:root[data-sec="other"]{--sec:#F2A65A;--sec2:#FBD9B5;--sec3:#FFF1E3;--sect:#6B3B0C}
:root[data-sec="chat"]{--sec:#D9BF8C;--sec2:#EBDCBE;--sec3:#F6EEDD;--sect:#5C4A24}
*{box-sizing:border-box}
html,body{margin:0;background:#EDE7DB}
body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--ink);word-break:keep-all;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
/* 글자 끌어서 선택 막기 (입력칸은 그대로) */
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text}
img,svg,a{-webkit-user-drag:none}
/* 스크롤바는 숨기고 화면을 끌어서 내림 */
html,body,*{scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,[aria-disabled="true"]{cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--sec);outline-offset:2px}
.bh{font-family:'Black Han Sans',sans-serif;font-weight:400}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.sub{color:var(--sub)}
.page{max-width:480px;min-height:100dvh;margin:0 auto;background-color:var(--bg);background-image:var(--grid);background-size:16px 16px;display:flex;flex-direction:column;position:relative}
.hd{position:sticky;top:0;z-index:6;background:var(--bg);height:60px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px}
.hd h1{flex:1;margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;padding-left:8px}
.hd .tt{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hd .tt b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tt span{font-size:12px;color:var(--sub)}
.hd.back{padding:0 8px}
.ib{width:44px;height:44px;flex:none;border:0;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;position:relative}
.brand{flex:1;min-height:44px;display:flex;align-items:center;gap:8px;padding-left:8px;text-decoration:none;min-width:0}
.brand b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mng{flex:none;height:40px;margin-right:8px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--bg);font:700 14px 'IBM Plex Sans KR',sans-serif;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.mng svg{stroke:var(--bg)}
.body{flex:1;padding:4px 24px 32px;display:flex;flex-direction:column;gap:16px}
.body.tight{gap:16px}
/* 아래 탭 (54번 B): 떠 있는 칸 묶음. 지금 탭 칸은 그 탭 색으로 왼쪽 위로 살짝 올라온다 */
.navw{position:sticky;bottom:0;z-index:6;flex:none;padding:8px 24px calc(20px + env(safe-area-inset-bottom));background-color:var(--bg);background-image:var(--grid);background-size:16px 16px;background-position:0 100%}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;height:64px;background:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh)}
.nav a{position:relative;background:var(--white);text-decoration:none;color:var(--sub);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .16s ease-out,box-shadow .16s ease-out}
.nav a:first-child{border-radius:10px 0 0 10px}.nav a:last-child{border-radius:0 10px 10px 0}
.nav a svg{stroke:var(--sub)}
.nav a[aria-current]{background:var(--sec);color:var(--ink);font-weight:700}
.nav a[aria-current] svg{stroke:var(--ink)}
.nav a:active,.nav a[aria-current]{transform:translate(-3px,-3px);box-shadow:0 0 0 2px var(--ink);z-index:1}
.nav a.lift{animation:mbnlift .36s cubic-bezier(.3,1.6,.5,1) both}
@keyframes mbnlift{from{transform:none;box-shadow:0 0 0 0 var(--ink)}to{transform:translate(-3px,-3px);box-shadow:0 0 0 2px var(--ink)}}
@media (prefers-reduced-motion:reduce){.nav a{transition:none}.nav a.lift{animation:none}}
.cta{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--ink);padding:12px 24px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.btn{height:52px;border:2px solid var(--ink);border-radius:12px;background:var(--white);font:700 16px 'IBM Plex Sans KR',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;text-align:center;color:var(--ink)}
.btn.o,.btn.pri{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.btn.ink,.btn.g{background:var(--ink);color:var(--bg)}
.btn.ink svg,.btn.g svg{stroke:var(--bg)}
.btn.c,.btn.danger{background:var(--white);color:var(--danger)}
.btn.sm{height:40px;font-size:14px;border-radius:10px;padding:0 12px}
.btn.xs{height:36px;font-size:12px;border-radius:8px;padding:0 8px}
.btn.block{width:100%}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.35;box-shadow:none}
.lnk{border:0;background:transparent;text-decoration:underline;font-size:14px;padding:8px 4px;min-height:44px}
.box{border:2px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--white);box-shadow:var(--sh)}
.box.blue{background:var(--sec2)}.box.gray{background:var(--white)}.box.pink{background:#FDD1D8}.box.green{background:var(--sec3)}.box.clay{background:var(--ink);color:var(--bg)}.box.teal{background:var(--white);color:var(--ink)}.box.ink{background:var(--ink);color:var(--bg)}.box.orange{background:var(--yel)}
.box.dash{border:2px dashed var(--ink);color:var(--sub);box-shadow:none;background:var(--white)}
.sec{display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--ink);padding-top:12px}
.sec>.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>.sh b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:20px}
/* 목록: 메뉴는 흰 카드가 한 장씩, 그냥 목록은 옅은 줄로 나눔 */
.lst{display:flex;flex-direction:column;gap:12px}
.lr{border:2px solid var(--ink);border-radius:12px;background:var(--white);box-shadow:var(--sh);width:100%;min-height:64px;padding:8px 16px;display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;text-decoration:none;color:var(--ink)}
.lr.big{min-height:72px;gap:16px}
.lr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lr .tx b{font-size:16px}.lr.bigt .tx b{font-size:16px}
.lr .tx span{font-size:12px;color:var(--sub)}
.lr .rt{font-size:12px;color:var(--sub);flex:none}
.ic{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--sec3)}
.lr.bigt .ic{width:40px;height:40px;border-radius:12px}
.ic.blue,.ic.pink,.ic.green,.ic.orange,.ic.clay,.ic.teal{background:var(--sec3)}.ic.ink{background:var(--ink)}
.chev{flex:none}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:5px;padding:0 8px;line-height:1.5;white-space:nowrap;background:var(--sec3);color:var(--sect)}
.tag.blue{background:var(--sec3);color:var(--sect)}.tag.orange,.tag.clay,.tag.ink,.tag.teal{background:var(--ink);color:var(--bg)}.tag.green{background:var(--white);color:var(--ink)}.tag.pink{background:#FFECEF;color:#6B3440}.tag.gray{background:var(--white);color:var(--ink)}
.tag.thin{border-width:2px;font-weight:500;color:var(--sub);border-color:var(--line);background:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border:2px solid var(--ink);border-radius:8px;background:var(--white);padding:0 12px;font:700 16px 'IBM Plex Sans KR',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chip.on,.chip.ob.on{background:var(--ink);color:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>.lb{font-size:14px;font-weight:700}
.inp{height:48px;border:2px solid var(--ink);border-radius:10px;background:var(--white);padding:0 12px;font-size:16px;width:100%;outline:none}
textarea.inp{height:auto;min-height:120px;padding:8px 12px;line-height:1.7;resize:vertical;font-size:14px}
.inp.n{width:64px;height:44px;text-align:center;font:700 20px 'Barlow Condensed',sans-serif;padding:0 8px}
.inp:focus{box-shadow:var(--sh)}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.err{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cn{display:flex;align-items:baseline;gap:4px}
.empty{border:2px dashed var(--ink);border-radius:12px;background:var(--white);padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--sub)}
.empty b{color:var(--ink);font-size:16px}
.stamp{transform:rotate(-4deg);background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:8px 16px;font-family:'Black Han Sans',sans-serif;font-size:20px;box-shadow:var(--sh)}
/* 아래에서 올라오는 창 */
.scrim{position:fixed;inset:0;background:rgba(18,17,16,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-top:2px solid var(--ink);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;padding:8px 24px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--mute);flex:none}
.sheet h3{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px}
.dlg{position:fixed;inset:0;background:rgba(18,17,16,.55);z-index:45;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg>div{background:var(--white);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh);width:100%;max-width:420px;padding:24px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:4px 4px 0 rgba(18,17,16,.3)}
.loading{padding:120px 16px;text-align:center;color:var(--sub)}
/* 처음 열 때: 화면 가운데에서 공이 굴러가듯 도는 로딩 (휴대폰, PC 같은 모양) */
.boot{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background-color:var(--bg);background-image:linear-gradient(rgba(18,17,16,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,17,16,.06) 1px,transparent 1px);background-size:16px 16px;color:var(--ink);font-size:14px;font-weight:700}
.bspin{position:relative;width:56px;height:56px;box-sizing:border-box;border-radius:50%;border:5px solid #DDD6C8;border-top-color:var(--ink);border-right-color:var(--ink);animation:bspin .9s linear infinite}
.bspin i{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#E46A2E;border:2px solid var(--ink);box-sizing:border-box}
@keyframes bspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.bspin{animation-duration:2.4s}}
/* 종이 표 (58번 B): 테두리 없는 흰 종이와 부드러운 그림자, 점 구멍선, 종이색 홈 */
.paper{box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14)}
.pcut{position:relative;height:2px;flex:none}
.pcut::before{content:"";position:absolute;left:20px;right:20px;top:0;height:2px;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:7px 2px;background-repeat:repeat-x}
.pcut::after{content:"";position:absolute;left:0;right:0;top:-11px;height:24px;background:radial-gradient(circle at 0 50%,var(--bg) 11.5px,transparent 12px),radial-gradient(circle at 100% 50%,var(--bg) 11.5px,transparent 12px)}
.kdot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);box-sizing:border-box}
.pt-k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#005459}
.pt{flex:none}.pt.soon{opacity:.7}
.pt-b{position:relative;display:flex;height:128px;background:var(--white);border-radius:10px;box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14)}
.pt-in{display:flex;flex:1;min-width:0;border-radius:10px;overflow:hidden}
.pt-m{flex:1;min-width:0;padding:12px 12px 12px 16px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--ink)}
.pt-t{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.pt-t b{font-size:44px;line-height:.9}.pt-t span{font-size:20px}
.pt-p{display:flex;flex-direction:column;font-size:12px;line-height:1.4;min-width:0}.pt-p b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-pf{flex:none;width:2px;margin:12px 0;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:2px 7px;background-repeat:repeat-y}
.pt-s{flex:none;width:92px;display:flex;align-items:stretch}
.pt-go{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--ink);text-align:center}
.pt-ans{display:flex;flex-direction:column;align-items:center;gap:2px}
.pt-bc{flex:none;width:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0;background:var(--white)}
.pt-bc span{font-size:12px;writing-mode:vertical-rl;color:var(--sub);line-height:1}
.pt-n{position:absolute;right:82px;width:22px;height:12px;background:var(--bg);z-index:1;pointer-events:none}
.pt-n.t{top:0;border-radius:0 0 11px 11px}.pt-n.b{bottom:0;border-radius:11px 11px 0 0}.pt-n.r8{right:8px}
/* 투표한 답: 도장처럼 톡 찍힘 */
.pstamp{animation:pstamp .34s cubic-bezier(.3,1.6,.5,1) .15s both}
@keyframes pstamp{from{transform:scale(1.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
/* 쓴 표 (기록): 오른쪽이 찢겨 나간 흰 종이, 남은 조각은 기록 분홍 */
.ru{display:block;flex:none;height:112px;text-decoration:none;color:var(--ink);filter:drop-shadow(0 1px 0 rgba(18,17,16,.08)) drop-shadow(0 6px 10px rgba(18,17,16,.14))}
.ru-b{position:relative;display:flex;height:112px;background:var(--white);border-radius:10px 0 0 10px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 10%,100% 20%,calc(100% - 10px) 30%,100% 40%,calc(100% - 10px) 50%,100% 60%,calc(100% - 10px) 70%,100% 80%,calc(100% - 10px) 90%,100% 100%,0 100%)}
.ru-m{flex:1;min-width:0;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:8px}
.ru-pf{flex:none;width:2px;margin:12px 0;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:2px 7px;background-repeat:repeat-y}
.ru-r{flex:none;width:18px;background:#E48398}
.ru-st{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);transform:rotate(-14deg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ru-st.no{border-style:dashed}
@media (prefers-reduced-motion:reduce){.pstamp,.qc{animation:none;transition:none}}
/* 취소된 일정 (59번): 빨간 도장, 흐린 표, 줄 그은 시각 */
.cxst{position:absolute;z-index:2;display:inline-flex;padding:4px 12px;border:2.5px solid var(--danger);border-radius:8px;color:var(--danger);background:rgba(251,247,239,.9);transform:rotate(-10deg);font-weight:700;letter-spacing:2px;pointer-events:none;white-space:nowrap}
.pt.cx .pt-m>.spread,.pt.cx .pt-t,.pt.cx .pt-p>b{opacity:.5}
.pt.cx .pt-t b{text-decoration:line-through;text-decoration-thickness:3px}
.bigt.cx{background:var(--white)}
.bigt.cx .top{opacity:.55}.bigt.cx .hh{text-decoration:line-through;text-decoration-thickness:4px}
.bigt.cx .bot>.spread,.bigt.cx .bot>.bar{opacity:.55}
/* 홈 시즌 패스 */
.pass{position:relative;background:var(--sec2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14)}
.mon{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px}
.mon b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1}
/* 일정 상세 큰 표 */
.bigt{background:var(--sec2);border-radius:12px;box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14);display:flex;flex-direction:column;position:relative}
.bigt.gray{background:var(--white)}
.bigt .top{padding:24px 24px 16px;display:flex;flex-direction:column;gap:8px}
.bigt .cut{position:relative;height:2px;flex:none}
.bigt .cut::before{content:"";position:absolute;left:20px;right:20px;top:0;height:2px;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:7px 2px;background-repeat:repeat-x}
.bigt .cut::after{content:"";position:absolute;left:0;right:0;top:-11px;height:24px;background:radial-gradient(circle at 0 50%,var(--bg) 11.5px,transparent 12px),radial-gradient(circle at 100% 50%,var(--bg) 11.5px,transparent 12px)}
.bigt .bot{padding:16px 24px 24px;display:flex;flex-direction:column;gap:8px}
.bigt .hh{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:92px;line-height:.9;letter-spacing:-1px}
.bar{height:6px;border-radius:3px;background:rgba(18,17,16,.2);display:block;overflow:hidden}
.bar i{display:block;height:6px;background:var(--ink)}
/* 투표 카드: 고르면 먹색으로 뒤집히고 기울어짐 */
.qc{height:58px;border:2px solid var(--ink);border-radius:6px;background:var(--white);font:700 16px 'IBM Plex Sans KR',sans-serif;transition:transform .25s cubic-bezier(.3,1.5,.6,1),box-shadow .25s,background .2s}
.qc .qs{display:none}
.qc.on{transform:rotate(-6deg) translateY(-4px);box-shadow:var(--sh);background:var(--ink);color:var(--bg)}
/* 고른 카드는 답마다 색: 참석 청록, 늦참 노랑, 불참 먹색(청록 그림자), 대기 옅은 청록. 나머지는 흰 바탕 회색 글씨, 점선은 마감 뒤 못 바꾸는 칸만 */
.qc.on.yes{background:#14BBC2;color:var(--ink)}
.qc.on.late{background:#FCD01A;color:var(--ink)}
.qc.on.wait{background:#B8E9EB;color:var(--ink)}
.qc.on.no{background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 #14BBC2}
.qc.dim{color:#6B655D}
.qc.lock{border-style:dashed;background:transparent;color:#6B655D;cursor:default}
.qq{height:34px;border:2px solid var(--ink);border-radius:7px;background:var(--white);font:700 16px/1 'Barlow Condensed',sans-serif}
.qq.on{background:var(--ink);color:var(--bg);transform:rotate(-4deg)}
.strip{border:2px solid var(--ink);border-radius:12px;background:var(--white);box-shadow:var(--sh);padding:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.strip>span{display:flex;flex-direction:column;gap:4px;text-decoration:none}
.strip b{font-family:'Barlow Condensed',sans-serif;font-size:32px;line-height:1}
.strip i{display:inline-block;flex:none;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.strip em{font-style:normal;font-size:12px}
.pitch{position:relative;height:300px;border-radius:12px;border:2px solid var(--ink);box-shadow:var(--sh);background:repeating-linear-gradient(180deg,#64A823 0 30px,#5B9A1F 30px 60px);overflow:hidden}
.pitch>.l{position:absolute;border:2px solid rgba(251,247,239,.9)}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.spot .d{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.spot.me .d{width:36px;height:36px;background:var(--ink);color:var(--bg);border:3px solid var(--white);box-shadow:0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.spot .p{font:700 12px 'Barlow Condensed',sans-serif}
.spot.me .p{font-size:12px;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 4px}
.sw{flex:none;position:relative;width:52px;height:30px;border:2px solid var(--ink);border-radius:15px;background:var(--white)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:var(--white);transition:left .2s}
.sw.on{background:var(--ink)}.sw.on i{left:25px}
.ava{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--white);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.kkb{height:54px;border:0;border-radius:12px;background:#FEE500;color:rgba(0,0,0,.85);font:600 16px -apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
/* 대화 (4-6): 일정마다 방 하나. 모래색 탭 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav a .nb{position:absolute;top:4px;left:calc(50% + 4px);min-width:20px;height:20px;box-sizing:border-box;padding:0 5px;border-radius:10px;border:2px solid var(--white);background:var(--ink);color:var(--bg);font:700 11px/16px 'Barlow Condensed','IBM Plex Sans KR',sans-serif;font-style:normal;text-align:center}
.chtabs{display:flex;gap:8px}
.chtab{height:40px;padding:0 16px;border:2px solid var(--ink);border-radius:20px;background:var(--white);font:700 14px 'IBM Plex Sans KR',sans-serif;color:var(--ink)}
.chtab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chr{display:flex;align-items:center;gap:12px;min-height:72px;box-sizing:border-box;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--white);box-shadow:4px 4px 0 var(--ink);text-decoration:none;color:var(--ink)}
.chd{flex:none;width:54px;height:50px;box-sizing:border-box;border:2px solid var(--ink);border-radius:10px;background:var(--sec2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.chd b{font:700 18px 'Barlow Condensed',sans-serif;letter-spacing:-.2px}
.chd span{font-size:11px;font-weight:700;margin-top:2px}
.chd.off{background:#F3EEE4}
.cht{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cht b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cht span{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:var(--sub)}
.chm .row{display:flex;gap:4px;align-items:center}
.chn{min-width:22px;height:22px;box-sizing:border-box;padding:0 6px;border-radius:11px;background:var(--ink);color:var(--bg);font:700 12px/22px 'Barlow Condensed',sans-serif;text-align:center}
.cha{width:22px;height:22px;box-sizing:border-box;border:2px solid var(--ink);border-radius:50%;background:var(--white);color:var(--ink);font:700 11px/18px 'IBM Plex Sans KR',sans-serif;text-align:center}
.chx{font-size:11px;font-weight:700;border:2px solid var(--ink);border-radius:5px;padding:0 6px;background:var(--white);color:var(--ink)}
.chtk{margin:4px 16px 0;display:flex;align-items:stretch;min-height:72px;border-radius:10px;background:var(--white);overflow:hidden;box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14)}
.chtk .l{flex:1;min-width:0;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12px}
.chtk .l b{font-size:14px;line-height:1.4}
.chtk .pf{flex:none;width:2px;margin:8px 0;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:2px 6px;background-repeat:repeat-y}
.chtk .st{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--sec)}
.chtk .st b{font:700 22px 'Barlow Condensed',sans-serif;line-height:1}
.chtk .st span{font-size:12px;font-weight:700}
.chtk.off .st{background:#F3EEE4}
.chlkw{display:flex;align-items:center;gap:8px;margin:12px 16px 0;font-size:12px;color:var(--sub)}
.chlkw span{flex:1}
.chlk{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--white);box-shadow:3px 3px 0 var(--ink);font-size:13px;font-weight:700;color:var(--ink);text-decoration:none}
.chlog{flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px;margin-top:12px;border-top:2px solid var(--ink)}
.chday{align-self:center;font-size:12px;font-weight:700;color:var(--sub);padding:2px 12px;border:2px solid var(--line);border-radius:12px;background:var(--white)}
.chsys{align-self:center;max-width:86%;text-align:center;font-size:12px;line-height:1.5;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:var(--sec3)}
.cm{display:flex;gap:8px;align-items:flex-start}
.cm.me{justify-content:flex-end}
.cm.cont{margin-top:-6px}
.cm.cont:not(.me){padding-left:40px}
.cav{flex:none;width:32px;height:32px;box-sizing:border-box;border:2px solid var(--ink);border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ccol{display:flex;flex-direction:column;gap:4px;max-width:78%;align-items:flex-start;min-width:0}
.cm.me .ccol{align-items:flex-end}
.cnm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.cnm b{font-size:13px}
.cnm .tag{font-size:10px;padding:0 4px}
.cnm .v{color:var(--sub)}
.cbr{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.cm.me .cbr{flex-direction:row-reverse}
.cb{display:inline-block;min-width:0;padding:9px 12px;border:2px solid var(--ink);border-radius:4px 14px 14px 14px;background:var(--white);font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.cm.me .cb{border-radius:14px 4px 14px 14px;background:var(--sec2)}
.cb.gone,.cm.me .cb.gone{border-style:dashed;box-shadow:none;background:var(--white);color:var(--sub)}
.cb.callme{box-shadow:5px 5px 0 var(--ink)}
.cb .at{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.cb .mk{font-weight:700;letter-spacing:1px;color:var(--sub)}
.ccol>.tag{font-size:11px}
.ctm{flex:none;font-size:11px;color:var(--sub);white-space:nowrap}
.chide{min-height:28px;padding:0 4px;border:0;background:transparent;font:500 12px 'IBM Plex Sans KR',sans-serif;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.cmk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;line-height:1.4;padding:2px 8px;border:2px solid var(--ink);border-radius:5px;background:var(--white)}
.chc{position:sticky;bottom:0;z-index:5;border-top:2px solid var(--ink);background:var(--white);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.chc .row{display:flex;gap:8px;align-items:flex-end}
.chc textarea{flex:1;min-width:0;height:48px;min-height:48px;max-height:140px;box-sizing:border-box;resize:none;border:2px solid var(--ink);border-radius:12px;padding:11px 12px;font:400 16px/1.4 'IBM Plex Sans KR',sans-serif;color:var(--ink);background:var(--bg)}
.chs{flex:none;height:48px;padding:0 16px;border:2px solid var(--ink);border-radius:12px;background:var(--yel);font:700 15px 'IBM Plex Sans KR',sans-serif;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.chs[aria-disabled="true"]{opacity:.35;box-shadow:none}
.chc .hint{font-size:11px;line-height:1.5;color:var(--sub)}
.chclosed{position:sticky;bottom:0;z-index:5;border-top:2px solid var(--ink);background:var(--sec3);padding:14px 16px calc(14px + env(safe-area-inset-bottom));font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center}
/* 테스트 사이트 표시: 휴대폰은 위 가운데, PC는 오른쪽 아래 (제목줄과 겹치지 않게) */
.stg{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;background:#B45309;color:#FFFFFF;font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;opacity:.9}
html.pc .stg{top:auto;left:auto;right:12px;bottom:12px;transform:none}
/* PC (가로 1024px 이상): 왼쪽 메뉴와 넓은 본문 (PC 시안 A안). 휴대폰은 그대로 */
html.pc body{background:var(--bg)}
html.pc .page{max-width:none;background-image:var(--grid)}
.pcw{display:flex;min-height:100dvh;width:100%;max-width:1280px;margin:0 auto;box-sizing:border-box;background:var(--bg)}
@media (min-width:1300px){.pcw{border-left:2px solid var(--ink);border-right:2px solid var(--ink)}html.pc body{background:#EDE6D8}}
.pcs{flex:none;width:256px;box-sizing:border-box;padding:24px 20px;display:flex;flex-direction:column;gap:24px;border-right:2px solid var(--ink);background:var(--bg);position:sticky;top:0;height:100dvh;overflow-y:auto;scrollbar-width:none}
.pcs::-webkit-scrollbar{display:none}
.pct{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px;box-sizing:border-box;border:2px solid var(--ink);border-radius:12px;background:var(--white);box-shadow:4px 4px 0 var(--ink);font-family:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.pctl{flex:none;display:flex}
.pctx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pctx b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pctx span{font-size:12px;white-space:pre}
.pnv{display:flex;flex-direction:column;gap:2px;background:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink)}
.pnv>a,.pnv>.off{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--white);color:var(--sub);font-size:16px;text-decoration:none}
.pnv.sm>a,.pnv.sm>.off{height:52px;font-size:15px}
.pnv>:first-child{border-radius:10px 10px 0 0}
.pnv>:last-child{border-radius:0 0 10px 10px}
.pnv svg{stroke:var(--sub);flex:none}
.pnv>a[aria-current]{background:var(--c);color:var(--ink);font-weight:700}
.pnv>a[aria-current] svg{stroke:var(--ink)}
.pnv>a{transition:transform .16s ease-out,box-shadow .16s ease-out,background-color .16s ease-out}
.pnv>a:hover:not([aria-current]){background:#F6F2EA;background:color-mix(in srgb,var(--c) 30%,var(--white));color:var(--ink);transform:translate(-2px,-2px);box-shadow:0 0 0 2px var(--ink);z-index:1}
.pnv>a:hover svg{stroke:var(--ink)}
.pnv>a:active,.pnv>a[aria-current]{transform:translate(-3px,-3px);box-shadow:0 0 0 2px var(--ink);z-index:2}
.pnv>a.lift{animation:mbnlift .36s cubic-bezier(.3,1.6,.5,1) both}
@media (prefers-reduced-motion:reduce){.pnv>a{transition:none}.pnv>a.lift{animation:none}}
.pnv>.off{color:var(--mute);cursor:default}
.pnv>.off svg{stroke:var(--mute)}
.pnv>.off i,.pcn{margin-left:auto;font-style:normal}
.pnv>.off i{font-size:11px;font-weight:700;border:2px dashed var(--mute);border-radius:5px;padding:0 6px;color:var(--sub)}
.pcn{min-width:24px;height:24px;box-sizing:border-box;padding:0 6px;border-radius:12px;background:var(--ink);color:var(--bg);font:700 13px/24px 'Barlow Condensed',sans-serif;text-align:center}
.pco{display:flex;flex-direction:column;gap:8px}
.pcoh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.pcoh i{width:10px;height:10px;box-sizing:border-box;border-radius:50%;border:2px solid var(--ink);background:#F2A65A}
.pcu{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:16px;border-top:2px solid var(--line)}
.pcun{flex:none;width:40px;height:40px;box-sizing:border-box;border-radius:50%;border:2px solid var(--ink);background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font:700 20px 'Barlow Condensed',sans-serif}
.pcux{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pcux b{font-size:16px}
.pcux span{font-size:12px;color:var(--sub)}
.pcm{flex:1;min-width:0;padding:24px 32px 40px;box-sizing:border-box}
.pcc{display:flex;flex-direction:column;gap:24px;min-height:calc(100dvh - 64px)}
/* PC 제목줄 (시안: 큰 제목, 달 숫자, 설명, 오른쪽 버튼) */
.pch1{display:flex;flex-wrap:wrap;align-items:center;gap:16px;min-height:64px}
.pch1 .t{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.pch1 h1{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:32px;line-height:1.2}
.pch1 .n{font:700 24px 'Barlow Condensed',sans-serif}
.pch1 .s{font-size:14px;color:var(--sub)}
.pch1 .r{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pch1 .r .mng,.pch1 .r .btn,.pch1 .r .tag.bc{height:44px;padding:0 16px;font-size:14px;border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
.pbtn{height:44px;padding:0 16px;box-sizing:border-box;border:2px solid var(--ink);border-radius:10px;background:var(--white);box-shadow:3px 3px 0 var(--ink);font:700 14px 'IBM Plex Sans KR',sans-serif;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.pbtn.o{background:var(--yel)}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.pbtn svg{width:16px;height:16px;stroke-width:2.8}
.pbk{flex:none;height:40px;padding:0 12px 0 8px;box-sizing:border-box;border:2px solid var(--ink);border-radius:8px;background:var(--bg);font:700 14px 'IBM Plex Sans KR',sans-serif;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.pbk svg{width:18px;height:18px}
html.pc .pcc>.body{padding:0 0 32px;width:100%;max-width:760px;box-sizing:border-box}
html.pc .pcc>.cta{width:100%;max-width:760px;box-sizing:border-box;margin:0}
html.pc .scrim{align-items:center;padding:24px}
html.pc .sheet{max-width:560px;border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding-bottom:28px}
html.pc .toast{bottom:40px}
/* PC 대화: 왼쪽 방 목록, 오른쪽 방 */
.pcsplit{width:100%;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:32px;align-items:start;padding:8px 0 32px}
.pcl{display:flex;flex-direction:column;gap:12px}
.dstep{display:inline-flex;align-items:stretch;height:44px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--white)}
.dstep button{width:44px;border:0;background:var(--white);font:700 18px 'IBM Plex Sans KR',sans-serif;color:var(--ink)}
.dstep button:disabled{opacity:.3}
.dstep b{min-width:72px;display:flex;align-items:center;justify-content:center;border-left:2px solid var(--ink);border-right:2px solid var(--ink);background:var(--sec3);font-size:15px}
.dlbox{display:flex;flex-direction:column;gap:10px;border:2px solid var(--ink);border-radius:12px;background:var(--white);padding:12px 14px}
