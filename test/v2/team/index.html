<style>
/* 17안: 네오브루탈리즘. 종이 바탕(#FBF7EF)에 16px 모눈, 글자와 선은 먹색(#121110), 카드는 흰 바탕에 2px 선과 4px 그림자.
   탭마다 색 한 벌(진한색, 중간색, 옅은색, 글자색): 홈 파랑, 일정 청록, 기록 분홍, 팀 초록, 운영 보라. 누를 곳은 노랑(#FCD01A) */
:root{--bg:#FBF7EF;--ink:#121110;--sub:#5B5650;--line:#DDD6C8;--mute:#9C9488;--gray:#FFFFFF;--white:#FFFFFF;--yel:#FCD01A;--danger:#8C3B28;
  --blue:#CDDFFF;--orange:#FCD01A;--green:#C8E8CD;--pink:#FDD1D8;--clay:#FFECEF;--teal:#121110;
  --sec:#7CA4F0;--sec2:#CDDFFF;--sec3:#EAF2FF;--sect:#304773;--grid:linear-gradient(rgba(18,17,16,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,17,16,.06) 1px,transparent 1px);--sh:4px 4px 0 var(--ink)}
:root[data-sec="schedule"]{--sec:#14BBC2;--sec2:#B8E9EB;--sec3:#E2F7F8;--sect:#005459}
:root[data-sec="record"]{--sec:#E48398;--sec2:#FDD1D8;--sec3:#FFECEF;--sect:#6B3440}
:root[data-sec="team"]{--sec:#69BA7C;--sec2:#C8E8CD;--sec3:#E8F6EA;--sect:#235430}
:root[data-sec="ops"]{--sec:#B093E5;--sec2:#DCCDF6;--sec3:#F4EFFF;--sect:#4A3577}
*{box-sizing:border-box}
html,body{margin:0;background:#EDE7DB}
body{font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--ink);word-break:keep-all;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
/* 글자 끌어서 선택 막기 (입력칸은 그대로) */
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text}
img,svg,a{-webkit-user-drag:none}
/* 스크롤바는 숨기고 화면을 끌어서 내림 */
html,body,*{scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,[aria-disabled="true"]{cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--sec);outline-offset:2px}
.bh{font-family:'Black Han Sans',sans-serif;font-weight:400}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.sub{color:var(--sub)}
.page{max-width:480px;min-height:100dvh;margin:0 auto;background-color:var(--bg);background-image:var(--grid);background-size:16px 16px;display:flex;flex-direction:column;position:relative}
.hd{position:sticky;top:0;z-index:6;background:var(--bg);height:60px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px}
.hd h1{flex:1;margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;padding-left:8px}
.hd .tt{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hd .tt b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tt span{font-size:12px;color:var(--sub)}
.hd.back{padding:0 8px}
.ib{width:44px;height:44px;flex:none;border:0;background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;position:relative}
.brand{flex:1;min-height:44px;display:flex;align-items:center;gap:8px;padding-left:8px;text-decoration:none;min-width:0}
.brand b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mng{flex:none;height:40px;margin-right:8px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--bg);font:700 14px 'IBM Plex Sans KR',sans-serif;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.mng svg{stroke:var(--bg)}
.body{flex:1;padding:4px 24px 32px;display:flex;flex-direction:column;gap:16px}
.body.tight{gap:16px}
/* 아래 탭 (54번 B): 떠 있는 칸 묶음. 지금 탭 칸은 그 탭 색으로 왼쪽 위로 살짝 올라온다 */
.navw{position:sticky;bottom:0;z-index:6;flex:none;padding:8px 24px calc(20px + env(safe-area-inset-bottom));background-color:var(--bg);background-image:var(--grid);background-size:16px 16px;background-position:0 100%}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;height:64px;background:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh)}
.nav a{position:relative;background:var(--white);text-decoration:none;color:var(--sub);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .16s ease-out,box-shadow .16s ease-out}
.nav a:first-child{border-radius:10px 0 0 10px}.nav a:last-child{border-radius:0 10px 10px 0}
.nav a svg{stroke:var(--sub)}
.nav a[aria-current]{background:var(--sec);color:var(--ink);font-weight:700}
.nav a[aria-current] svg{stroke:var(--ink)}
.nav a:active,.nav a[aria-current]{transform:translate(-3px,-3px);box-shadow:0 0 0 2px var(--ink);z-index:1}
.nav a.lift{animation:mbnlift .36s cubic-bezier(.3,1.6,.5,1) both}
@keyframes mbnlift{from{transform:none;box-shadow:0 0 0 0 var(--ink)}to{transform:translate(-3px,-3px);box-shadow:0 0 0 2px var(--ink)}}
@media (prefers-reduced-motion:reduce){.nav a{transition:none}.nav a.lift{animation:none}}
.cta{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--ink);padding:12px 24px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.btn{height:52px;border:2px solid var(--ink);border-radius:12px;background:var(--white);font:700 16px 'IBM Plex Sans KR',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;text-align:center;color:var(--ink)}
.btn.o,.btn.pri{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.btn.ink,.btn.g{background:var(--ink);color:var(--bg)}
.btn.ink svg,.btn.g svg{stroke:var(--bg)}
.btn.c,.btn.danger{background:var(--white);color:var(--danger)}
.btn.sm{height:40px;font-size:14px;border-radius:10px;padding:0 12px}
.btn.xs{height:36px;font-size:12px;border-radius:8px;padding:0 8px}
.btn.block{width:100%}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.35;box-shadow:none}
.lnk{border:0;background:transparent;text-decoration:underline;font-size:14px;padding:8px 4px;min-height:44px}
.box{border:2px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--white);box-shadow:var(--sh)}
.box.blue{background:var(--sec2)}.box.gray{background:var(--white)}.box.pink{background:#FDD1D8}.box.green{background:var(--sec3)}.box.clay{background:var(--ink);color:var(--bg)}.box.teal{background:var(--white);color:var(--ink)}.box.ink{background:var(--ink);color:var(--bg)}.box.orange{background:var(--yel)}
.box.dash{border:2px dashed var(--ink);color:var(--sub);box-shadow:none;background:var(--white)}
.sec{display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--ink);padding-top:12px}
.sec>.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>.sh b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:20px}
/* 목록: 메뉴는 흰 카드가 한 장씩, 그냥 목록은 옅은 줄로 나눔 */
.lst{display:flex;flex-direction:column;gap:12px}
.lr{border:2px solid var(--ink);border-radius:12px;background:var(--white);box-shadow:var(--sh);width:100%;min-height:64px;padding:8px 16px;display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;text-decoration:none;color:var(--ink)}
.lr.big{min-height:72px;gap:16px}
.lr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lr .tx b{font-size:16px}.lr.bigt .tx b{font-size:16px}
.lr .tx span{font-size:12px;color:var(--sub)}
.lr .rt{font-size:12px;color:var(--sub);flex:none}
.ic{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--sec3)}
.lr.bigt .ic{width:40px;height:40px;border-radius:12px}
.ic.blue,.ic.pink,.ic.green,.ic.orange,.ic.clay,.ic.teal{background:var(--sec3)}.ic.ink{background:var(--ink)}
.chev{flex:none}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:5px;padding:0 8px;line-height:1.5;white-space:nowrap;background:var(--sec3);color:var(--sect)}
.tag.blue{background:var(--sec3);color:var(--sect)}.tag.orange,.tag.clay,.tag.ink,.tag.teal{background:var(--ink);color:var(--bg)}.tag.green{background:var(--white);color:var(--ink)}.tag.pink{background:#FFECEF;color:#6B3440}.tag.gray{background:var(--white);color:var(--ink)}
.tag.thin{border-width:2px;font-weight:500;color:var(--sub);border-color:var(--line);background:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border:2px solid var(--ink);border-radius:8px;background:var(--white);padding:0 12px;font:700 16px 'IBM Plex Sans KR',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chip.on,.chip.ob.on{background:var(--ink);color:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>.lb{font-size:14px;font-weight:700}
.inp{height:48px;border:2px solid var(--ink);border-radius:10px;background:var(--white);padding:0 12px;font-size:16px;width:100%;outline:none}
textarea.inp{height:auto;min-height:120px;padding:8px 12px;line-height:1.7;resize:vertical;font-size:14px}
.inp.n{width:64px;height:44px;text-align:center;font:700 20px 'Barlow Condensed',sans-serif;padding:0 8px}
.inp:focus{box-shadow:var(--sh)}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.err{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cn{display:flex;align-items:baseline;gap:4px}
.empty{border:2px dashed var(--ink);border-radius:12px;background:var(--white);padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--sub)}
.empty b{color:var(--ink);font-size:16px}
.stamp{transform:rotate(-4deg);background:var(--white);border:2px solid var(--ink);border-radius:8px;padding:8px 16px;font-family:'Black Han Sans',sans-serif;font-size:20px;box-shadow:var(--sh)}
/* 아래에서 올라오는 창 */
.scrim{position:fixed;inset:0;background:rgba(18,17,16,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-top:2px solid var(--ink);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;padding:8px 24px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--mute);flex:none}
.sheet h3{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px}
.dlg{position:fixed;inset:0;background:rgba(18,17,16,.55);z-index:45;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg>div{background:var(--white);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh);width:100%;max-width:420px;padding:24px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:4px 4px 0 rgba(18,17,16,.3)}
.loading{padding:120px 16px;text-align:center;color:var(--sub)}
/* 종이 표 (58번 B): 테두리 없는 흰 종이와 부드러운 그림자, 점 구멍선, 종이색 홈 */
.paper{box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14)}
.pcut{position:relative;height:2px;flex:none}
.pcut::before{content:"";position:absolute;left:20px;right:20px;top:0;height:2px;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:7px 2px;background-repeat:repeat-x}
.pcut::after{content:"";position:absolute;left:0;right:0;top:-11px;height:24px;background:radial-gradient(circle at 0 50%,var(--bg) 11.5px,transparent 12px),radial-gradient(circle at 100% 50%,var(--bg) 11.5px,transparent 12px)}
.kdot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);box-sizing:border-box}
.pt-k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#005459}
.pt{flex:none}.pt.soon{opacity:.7}
.pt-b{position:relative;display:flex;height:128px;background:var(--white);border-radius:10px;box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14)}
.pt-in{display:flex;flex:1;min-width:0;border-radius:10px;overflow:hidden}
.pt-m{flex:1;min-width:0;padding:12px 12px 12px 16px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--ink)}
.pt-t{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.pt-t b{font-size:44px;line-height:.9}.pt-t span{font-size:20px}
.pt-p{display:flex;flex-direction:column;font-size:12px;line-height:1.4;min-width:0}.pt-p b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-pf{flex:none;width:2px;margin:12px 0;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:2px 7px;background-repeat:repeat-y}
.pt-s{flex:none;width:92px;display:flex;align-items:stretch}
.pt-go{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--ink);text-align:center}
.pt-ans{display:flex;flex-direction:column;align-items:center;gap:2px}
.pt-bc{flex:none;width:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0;background:var(--white)}
.pt-bc span{font-size:12px;writing-mode:vertical-rl;color:var(--sub);line-height:1}
.pt-n{position:absolute;right:82px;width:22px;height:12px;background:var(--bg);z-index:1;pointer-events:none}
.pt-n.t{top:0;border-radius:0 0 11px 11px}.pt-n.b{bottom:0;border-radius:11px 11px 0 0}.pt-n.r8{right:8px}
/* 투표한 답: 도장처럼 톡 찍힘 */
.pstamp{animation:pstamp .34s cubic-bezier(.3,1.6,.5,1) .15s both}
@keyframes pstamp{from{transform:scale(1.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
/* 쓴 표 (기록): 오른쪽이 찢겨 나간 흰 종이, 남은 조각은 기록 분홍 */
.ru{display:block;flex:none;height:112px;text-decoration:none;color:var(--ink);filter:drop-shadow(0 1px 0 rgba(18,17,16,.08)) drop-shadow(0 6px 10px rgba(18,17,16,.14))}
.ru-b{position:relative;display:flex;height:112px;background:var(--white);border-radius:10px 0 0 10px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 10%,100% 20%,calc(100% - 10px) 30%,100% 40%,calc(100% - 10px) 50%,100% 60%,calc(100% - 10px) 70%,100% 80%,calc(100% - 10px) 90%,100% 100%,0 100%)}
.ru-m{flex:1;min-width:0;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:8px}
.ru-pf{flex:none;width:2px;margin:12px 0;background-image:radial-gradient(circle,var(--ink) 1.2px,transparent 1.4px);background-size:2px 7px;background-repeat:repeat-y}
.ru-r{flex:none;width:18px;background:#E48398}
.ru-st{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);transform:rotate(-14deg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ru-st.no{border-style:dashed}
@media (prefers-reduced-motion:reduce){.pstamp,.qc{animation:none;transition:none}}
/* 취소된 일정 (59번): 빨간 도장, 흐린 표, 줄 그은 시각 */
.cxst{position:absolute;z-index:2;display:inline-flex;padding:4px 12px;border:2.5px solid var(--danger);border-radius:8px;color:var(--danger);background:rgba(251,247,239,.9);transform:rotate(-10deg);font-weight:700;letter-spacing:2px;pointer-events:none;white-space:nowrap}
.pt.cx .pt-m>.spread,.pt.cx .pt-t,.pt.cx .pt-p>b{opacity:.5}
.pt.cx .pt-t b{text-decoration:line-through;text-decoration-thickness:3px}
.bigt.cx{background:var(--white)}
.bigt.cx .top{opacity:.55}.bigt.cx .hh{text-decoration:line-through;text-decoration-thickness:4px}
.bigt.cx .bot>.spread,.bigt.cx .bot>.bar{opacity:.55}
/* 홈 시즌 패스 */
.pass{position:relative;background:var(--sec2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14)}
.mon{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px}
.mon b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:32px;line-height:1}
/* 일정 상세 큰 표 */
.bigt{background:var(--sec2);border-radius:12px;box-shadow:0 1px 0 rgba(18,17,16,.08),0 6px 14px rgba(18,17,16,.14);display:flex;flex-direction:column;position:relative}
.bigt.gray{background:var(--white)}
