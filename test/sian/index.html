<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>매니볼 화면 둘러보기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBF7EF;background-image:linear-gradient(rgba(18,17,16,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,17,16,.06) 1px,transparent 1px);background-size:16px 16px;color:#121110;font-family:'IBM Plex Sans KR',sans-serif;word-break:keep-all}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:12px;background:#5B8DEF;border:2px solid #121110;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:28px}
.lead{font-size:14px;line-height:1.6;margin:12px 0 20px;max-width:640px}
.tabs{display:flex;gap:8px;margin-bottom:20px;position:sticky;top:0;padding:10px 0;background:#FBF7EF;z-index:5}
.tab{height:44px;padding:0 18px;border:2px solid #121110;border-radius:10px;background:#fff;font:700 15px 'IBM Plex Sans KR',sans-serif;color:#121110;cursor:pointer}
.tab[aria-pressed=true]{background:#121110;color:#FBF7EF}
.grp{margin:0 0 28px}
.grp h2{margin:0 0 10px;font-size:18px;border-bottom:2px solid #121110;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:2px solid #121110;border-radius:12px;background:#fff;box-shadow:3px 3px 0 #121110;color:#121110;text-decoration:none;min-height:72px}
.card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #121110}
.card b{font-size:14px;line-height:1.4}
.card span{font-size:12px;color:#5B5650}
.note{font-size:12px;color:#5B5650}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo" aria-hidden="true"><svg width="33" height="33" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#121110" stroke-width="5"/><circle cx="23" cy="26" r="3.6" fill="#E46A2E"/><circle cx="23" cy="38" r="3.6" fill="#E46A2E"/><path d="M30 26 H43 M30 38 H41" fill="none" stroke="#121110" stroke-width="5" stroke-linecap="round"/></svg></span><h1>매니볼 화면 둘러보기</h1></div>
  <p class="lead">매니볼 시안 화면이에요. 로그인 없이 눌러 볼 수 있고, 화면 안의 버튼도 눌러져요. 이름과 기록은 모두 예시예요.</p>
  <div class="tabs" role="tablist"></div>
  <div id="list"></div>
  <p class="note">시안 화면이라 실제 앱과 조금 다를 수 있어요.</p>
</div>
<script src="boards.js"></script>
<script>
(function () {
  var S = window.SIAN, tabs = document.querySelector('.tabs'), list = document.getElementById('list');
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var cur = (location.hash.replace('#', '') in S) ? location.hash.replace('#', '') : (window.innerWidth >= 1024 ? 'p' : 'm');
  function draw() {
    tabs.innerHTML = Object.keys(S).map(function (k) { return '<button type="button" class="tab" aria-pressed="' + (k === cur) + '" data-k="' + k + '">' + esc(S[k].label) + ' 화면</button>'; }).join('');
    list.innerHTML = S[cur].groups.map(function (g) {
      return '<section class="grp"><h2>' + esc(g.title) + '</h2><div class="grid">' + g.boards.map(function (b) {
        var m = b.t.match(/^([0-9-]+)\s*(.*)$/); var num = m ? m[1] : ''; var name = m ? m[2] : b.t;
        return '<a class="card" href="view.html?c=' + cur + '&f=' + encodeURIComponent(b.f) + '"><span>' + esc(num) + '</span><b>' + esc(name) + '</b></a>';
      }).join('') + '</div></section>';
    }).join('');
  }
  tabs.addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (!b) return; cur = b.dataset.k; history.replaceState(null, '', '#' + cur); draw(); });
  draw();
})();
</script>
</body>
</html>
