<script type="text/x-dc" id="dc-code">
class Component extends DCLogic {
  renderVals() { /*maniball-interactive*/
    const A = this.props.accent ?? '#15803D';

 10px 16px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 10px 16px", "off": "text-decoration: none; color: #111827; border: 1px solid #E5E7EB; border-radius: 999px; padding: 10px 16px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 10px 16px", "off": "text-decoration: none; color: #111827; border: 1px solid #E5E7EB; border-radius: 999px; padding: 10px 16px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 10px 16px", "off": "text-decoration: none; border: 1px dashed #D1D5DB; color: #6B7280; border-radius: 999px; padding: 10px 16px"}], "labs": ["1일", "5일", "10일", "25일", "말일", "직접"]}, {"id": "c4", "k": "field", "val": "TEST FS", "label": "팀 이름", "node": 2239}, {"id": "c5", "k": "field", "val": "30,000", "label": "금액", "node": 3904}];

        };
        if (c.a === 'hide') { v[k + 'r'] = c.rs + (done ? '; display: none' : ''); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast(c.msg); }; }
        if (c.a === 'got') { v[k + 's'] = done ? c.s1 : c.s0; v[k + 't'] = done ? '받음 완료' : '받음'; v[k + 'k'] = (ev) => { pd(ev); if (!done) { set({ [k]: 1 }); toast('현금으로 받은 걸로 처리했어요'); } }; }
        if (c.a === 'link') { v[k + 't'] = get(k, c.code); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: Math.random().toString(36).slice(2, 8).toUpperCase() }); toast('새 링크를 만들었어요. 예전 링크는 막혔어요'); }; }
        if (c.a === 'readall') {
          (c.rows || []).forEach((r, i) => { v[k + '_' + i + 'r'] = done ? r.replace('background: #F0FDF4', 'background: #FFFFFF') : r; });
          (c.dots || []).forEach((d, i) => { v[k + '_' + i + 'd'] = done ? d.replace('background: #DC2626', 'background: transparent') : d; });
          v[k + 't'] = done ? '0개' : (c.cnt || '');
          v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast('모두 읽음으로 바꿨어요'); };
        }
        if (c.a === 'photo') {
          const url = get(k, '');
          v[k + 'ps'] = fix(c.ts) + (url ? '; background: center / cover no-repeat url(' + url + ')' : '');
          v[k + 'sv'] = url ? 'display: none' : '';
          v[k + 'pt'] = url ? '' : (c.pt || '');
          v[k + 'c'] = (ev) => { const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (f) { set({ [k]: URL.createObjectURL(f) }); toast('사진을 바꿨어요'); } };
        }
        if (c.a === 'selectall') v[k + 'k'] = (ev) => { pd(ev); const o = {}; T.forEach((x) => { if (x.k === 'chk') o[x.id] = true; }); set(o); toast('모두 골랐어요'); };
        if (c.a === 'edit') v[k + 'k'] = (ev) => { pd(ev); set({ _edit: !get('_edit', false) }); };
      }
    });
    const val = (id) => (byId[id] && byId[id].k === 'field' ? get(id, byId[id].val) : '');
    const pick = (id) => { const c = byId[id]; if (!c) return ''; const i = get(id, c.sel); return c.multi ? i.map((x) => c.labs[x]) : (i >= 0 ? c.labs[i] : ''); };
    const chk = (id) => { const c = byId[id]; return c ? get(id, c.on) : false; };

    const R0 = [["r0n", "지각"], ["r1n", "무단 결석"], ["r2n", "직전 취소"], ["r3n", "구장 정리는 다 같이 해요"]];
    const A0 = [["r0a", "2,000원"], ["r1a", "10,000원"], ["r2a", "5,000원"], [null, ""]];
    const fv = (k, d) => get(k, d);
    R0.forEach(([k, d]) => { v[k + 'v'] = fv(k, d); v[k + 'c'] = (ev) => set({ [k]: ev.target.value }); });
    A0.forEach(([k, d]) => { if (!k) return; v[k + 'v'] = fv(k, d); v[k + 'c'] = (ev) => set({ [k]: ev.target.value }); });
    const added = get('_rules', []);
    v.added = added.map((r, i) => ({ nv: r.n, av: r.a, pn: r.n || '새 수칙', pa: r.a, nc: (ev) => { const a = added.slice(); a[i] = { ...a[i], n: ev.target.value }; set({ _rules: a }); }, ac: (ev) => { const a = added.slice(); a[i] = { ...a[i], a: ev.target.value }; set({ _rules: a }); } }));
    v.addRule = (ev) => { pd(ev); set({ _rules: added.concat([{ n: '', a: '' }]) }); };
    const mode = pick('c2'), day = pick('c3');
    const dayOwn = String(get('_day', '')).replace(/\D/g, '').slice(0, 2); v.dayV = dayOwn; v.dayC = (ev) => set({ _day: ev.target.value }); v.dayOwn = day === '직접' && mode === '월회비';
    v.pvSport = pick('c1') || '풋살팀';
    v.pvName = val('c4') || '우리 팀';
    const amt = val('c5') || '0';
    v.pvAmt = mode === '안 받음' ? '회비 없음' : amt + '원';
    v.pvUnit = mode === '안 받음' ? '' : (mode === '경기마다' ? ' / 경기' : ' / 월');
    v.pvNote = mode === '안 받음' ? '회비를 받지 않아요' : mode === '경기마다' ? '경기 날 현장에서 내요' : day === '말일' ? '매월 말일까지 내요' : day === '직접' ? '매월 ' + (dayOwn || '정한 ') + '일까지 내요' : '매월 ' + day + '까지 내요';
    R0.forEach(([k, d], i) => { v['p' + i + 'n'] = fv(k, d); const a = A0[i] && A0[i][0]; v['p' + i + 'a'] = a ? fv(a, A0[i][1]) : ''; });
    return v;
  }
}
