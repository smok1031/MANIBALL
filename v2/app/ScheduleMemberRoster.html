<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>참석 명단 | 매니볼</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#15803D}
</style>
<style>html{background:#E5E7EB}body{background:#E5E7EB}a{-webkit-tap-highlight-color:transparent}a[href="#"]{cursor:default}</style>
</head>
<body>
<div style="width: 100%; max-width: 480px; box-sizing: border-box; min-height: 100dvh; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #F6F7F9; display: flex; flex-direction: column; position: relative; word-break: keep-all">
  <header style="position: sticky; top: 0; z-index: 3; background: #FFFFFF; border-bottom: 1px solid #F3F4F6; height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="ScheduleMember.html" aria-label="뒤로" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <b style="flex: 1; font-size: 17px">11.15 참석 명단</b>
    <span style="width: 44px"></span>
  </header>
  <div style="padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 10px; align-items: center; background: #FFFFFF; border-radius: 16px; padding: 14px"><b style="flex: 1; font-size: 15px">11.15 토 08:00 경기</b><span style="font-size: 13px; color: #6B7280">정원 12명</span></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 10px"><b style="font-size: 15px">참석 <span style="color: #6B7280; font-weight: 500">10명</span></b><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">정성목</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">김민준</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">윤지호</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">정우진</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">박도윤</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">이서준</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">한지성</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">강도현</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">서민호</span><span style="background: #DCFCE7; color: #166534; border-radius: 999px; padding: 7px 12px; font-size: 14px">문승우</span></div></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 10px"><b style="font-size: 15px">늦참 <span style="color: #6B7280; font-weight: 500">1명</span></b><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="background: #FEF3C7; color: #92400E; border-radius: 999px; padding: 7px 12px; font-size: 14px">배준혁, 3Q부터</span></div></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 10px"><b style="font-size: 15px">불참 <span style="color: #6B7280; font-weight: 500">1명</span></b><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="background: #F3F4F6; color: #374151; border-radius: 999px; padding: 7px 12px; font-size: 14px">홍유찬</span></div></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 10px"><b style="font-size: 15px">대기 <span style="color: #6B7280; font-weight: 500">1명</span></b><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="background: #F3F4F6; color: #374151; border-radius: 999px; padding: 7px 12px; font-size: 14px">최하준</span></div></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 10px"><b style="font-size: 15px">미응답 <span style="color: #6B7280; font-weight: 500">4명</span></b><div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="background: #FEF2F2; color: #B91C1C; border-radius: 999px; padding: 7px 12px; font-size: 14px">오태윤</span><span style="background: #FEF2F2; color: #B91C1C; border-radius: 999px; padding: 7px 12px; font-size: 14px">신재원</span><span style="background: #FEF2F2; color: #B91C1C; border-radius: 999px; padding: 7px 12px; font-size: 14px">임건우</span><span style="background: #FEF2F2; color: #B91C1C; border-radius: 999px; padding: 7px 12px; font-size: 14px">조현우</span></div></div>
    <p style="margin: 2px 4px 0; font-size: 12px; color: #6B7280; line-height: 1.5">정원이 차면 다음 신청은 대기로 들어가고, 자리가 나면 순서대로 올라가요</p>
  </div>
</div>
<script src="proto.js"></script>
</body>
</html>
