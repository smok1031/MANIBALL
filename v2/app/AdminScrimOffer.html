<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<div id="dc-root"></div>
<template id="dc-tpl"><div style="width: 100%; max-width: 480px; box-sizing: border-box; min-height: 100dvh; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #F6F7F9; display: flex; flex-direction: column; position: relative; word-break: keep-all">
  <header style="position: sticky; top: 0; z-index: 3; background: #FFFFFF; border-bottom: 1px solid #F3F4F6; height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="ScheduleAdmin.html" aria-label="뒤로" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <b style="flex: 1; font-size: 17px">내전 검토</b>
    <span style="width: 44px"></span>
  </header>
  <div style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px; align-items: flex-start; background: #EEF2FF; color: #3730A3; border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5"><b style="flex: none">알림</b><span>11.19 수 09:00에 운영진 모두에게 갔어요. 상의해서 정해 주세요.</span></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="display: flex; gap: 6px; align-items: center; font-size: 13px; color: #6B7280"><span style="background: #DCFCE7; color: #166534; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px">경기</span>11.22 토 08:00, 잠실 풋살장, 상대팀 미정</span>
      <div style="display: flex; align-items: baseline; gap: 8px"><b style="font-size: 36px; font-weight: 900; letter-spacing: -1px">20명</b><span style="font-size: 14px; color: #4B5563">참석 14 + 대기 6</span></div>
      <span style="font-size: 13px; color: #6B7280">팀원 16명 모두와 용병 4명이에요</span>
      <div style="display: flex; flex-direction: column"><div style="display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #F3F4F6"><span style="width: 22px; height: 22px; border-radius: 50%; background: #15803D; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex: none">✓</span><span style="flex: 1; font-size: 14px"><b>참석과 대기를 합쳐 20명 이상</b><br><span style="font-size: 12px; color: #6B7280">내전을 하려면 20명이 필요해요</span></span></div><div style="display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #F3F4F6"><span style="width: 22px; height: 22px; border-radius: 50%; background: #15803D; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex: none">✓</span><span style="flex: 1; font-size: 14px"><b>3일 전까지 20명 유지</b><br><span style="font-size: 12px; color: #6B7280">11.19 수 09:00 기준 20명</span></span></div><div style="display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #F3F4F6"><span style="width: 22px; height: 22px; border-radius: 50%; background: #15803D; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex: none">✓</span><span style="flex: 1; font-size: 14px"><b>상대팀 미정</b><br><span style="font-size: 12px; color: #6B7280">매칭된 팀이 있으면 내전으로 바꿀 수 없어요</span></span></div></div>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 8px"><b style="font-size: 15px">내전으로 바꾸면</b><span style="display: flex; gap: 8px; font-size: 14px; line-height: 1.5"><span style="color: #3730A3; font-weight: 700">✓</span>대기 6명도 모두 참석으로 올라가요</span><span style="display: flex; gap: 8px; font-size: 14px; line-height: 1.5"><span style="color: #3730A3; font-weight: 700">✓</span>A팀, B팀 10명씩 나눠서 해요</span><span style="display: flex; gap: 8px; font-size: 14px; line-height: 1.5"><span style="color: #3730A3; font-weight: 700">✓</span>팀은 운영진이 스쿼드에서 직접 골라요</span><span style="display: flex; gap: 8px; font-size: 14px; line-height: 1.5"><span style="color: #3730A3; font-weight: 700">✓</span>신청한 20명에게 바로 알림이 가요</span></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 0"><div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px"><b style="font-size: 15px">운영진 의견</b><span style="font-size: 12px; color: #6B7280">운영진끼리만 보여요</span></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F3F4F6"><span style="flex: 1"><b style="font-size: 15px">정성목</b> <span style="font-size: 12px; color: #6B7280">팀장, 나</span></span><span style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; width: 120px; font-size: 13px; font-weight: 700; text-align: center"><a href="#" style="{{ c1_0s }}" onClick="{{ c1_0k }}">찬성</a><a href="#" style="{{ c1_1s }}" onClick="{{ c1_1k }}">반대</a></span></div>
      <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F3F4F6"><span style="flex: 1"><b style="font-size: 15px">김민준</b> <span style="font-size: 12px; color: #6B7280">운영진, 11.19 10:12</span><br><span style="font-size: 13px; color: #374151">구장 옆 코트까지 같이 잡을 수 있어요. 해 봐요!</span></span><span style="background: #EEF2FF; color: #3730A3; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; flex: none">찬성</span></div>
      <sc-for list="{{ comments }}" as="m" hint-placeholder-count="0"><div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F3F4F6"><span style="flex: 1"><b style="font-size: 15px">정성목</b> <span style="font-size: 12px; color: #6B7280">팀장, 방금</span><br><span style="font-size: 13px; color: #374151">{{ m.t }}</span></span><span style="background: #EEF2FF; color: #3730A3; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; flex: none">{{ m.vote }}</span></div></sc-for>
      <div style="padding-top: 10px"><label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #6B7280">의견 남기기</span><span style="background: #FFFFFF; border: 1px solid #D1D5DB; border-radius: 12px; padding: 13px 14px; font-size: 16px; font-weight: 700; color: #111827; display: flex; justify-content: space-between"><input aria-label="의견 남기기" placeholder="예: 구장 시간 늘릴 수 있는지 볼게요" value="{{ c2v }}" onChange="{{ c2c }}" style="border: 0; outline: none; background: transparent; font: inherit; color: #111827; padding: 0; margin: 0; min-width: 0; width: 100%; flex: 1"><span style="color: #6B7280; font-weight: 500"></span></span></label><button type="button" onClick="{{ addCm }}" style="border: none; cursor: pointer; font: inherit; margin-top: 8px; width: 100%; background: #3730A3; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 12px 0; border-radius: 12px">의견 남기기</button></div>
    </div>
  </div>
  <div style="position: sticky; bottom: 0; margin-top: auto; background: #FFFFFF; border-top: 1px solid #F3F4F6; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><a href="AdminScrimKeep.html" style="display: block; text-decoration: none; text-align: center; background: #F3F4F6; color: #111827; font-weight: 700; font-size: 15px; padding: 14px 0; border-radius: 14px">경기로 그대로</a><a href="AdminScrimNotify.html" style="display: block; text-decoration: none; text-align: center; background: #15803D; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 15px 0; border-radius: 14px; background: #3730A3; font-size: 15px; padding: 14px 0">내전으로 바꾸기</a></div><span style="color: #6B7280; font-size: 13px; text-align: center">정하면 신청한 팀원에게 알림이 가요</span>
  </div>
</div></template>
<script type="text/x-dc" id="dc-code">
class Component extends DCLogic {
  renderVals() { /*maniball-interactive*/
    const A = this.props.accent ?? '#15803D';
    const S = this.state || {};
    const T = [{"id": "c1", "k": "sel", "multi": false, "sel": 0, "els": [{"on": "text-decoration: none; background: #EEF2FF; color: #3730A3; border-radius: 8px; padding: 8px 0; box-shadow: inset 0 0 0 1.5px #3730A3", "off": "text-decoration: none; background: #F3F4F6; color: #9CA3AF; border-radius: 8px; padding: 8px 0"}, {"on": "text-decoration: none; background: #EEF2FF; color: #3730A3; border-radius: 8px; padding: 8px 0; box-shadow: inset 0 0 0 1.5px #3730A3", "off": "text-decoration: none; background: #F3F4F6; color: #9CA3AF; border-radius: 8px; padding: 8px 0"}], "labs": ["찬성", "반대"]}, {"id": "c2", "k": "field", "val": "", "label": "의견 남기기", "node": 6100}];
    const fix = (x) => String(x == null ? '' : x).split('{{accent}}').join(A);
    const set = (o) => this.setState(o);
    const pd = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    const get = (k, d) => (S[k] === undefined ? d : S[k]);
    const v = { accent: A, toastOn: !!S._toast, toastText: S._toast || '' };
    const toast = (m) => { set({ _toast: m }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ _toast: '' }), 1800); };
    const byId = {};
    T.forEach((c) => { byId[c.id] = c; });
    T.forEach((c) => {
      const k = c.id;
      if (c.k === 'sel') {
        const cur = get(k, c.sel);
        c.els.forEach((e, i) => {
          const on = c.multi ? cur.indexOf(i) >= 0 : cur === i;
          v[k + '_' + i + 's'] = fix(on ? e.on : e.off);
          v[k + '_' + i + 'k'] = (ev) => {
            pd(ev);
            if (c.multi) { const a = cur.slice(); const j = a.indexOf(i); if (j >= 0) a.splice(j, 1); else a.push(i); set({ [k]: a }); }
            else set({ [k]: i });
          };
        });
      } else if (c.k === 'tog') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 'n'] = on ? c.non : c.noff;
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'chk') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 't'] = on ? '✓' : '';
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'step') {
        const n = get(k, c.val);
        v[k + 't'] = n + c.suf;
        if (c.bst !== undefined) v[k + 'bs'] = c.bst.replace(/color: #(D1D5DB|111827)/, 'color: ' + (n ? '#111827' : '#D1D5DB'));
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: Math.max(0, n - 1) }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: n + 1 }); };
      } else if (c.k === 'field') {
        v[k + 'v'] = get(k, c.val);
        v[k + 'c'] = (ev) => set({ [k]: ev && ev.target ? ev.target.value : '' });
      } else if (c.k === 'month') {
        const off = get(k, 0); let y = c.y, m = c.m + off;
        while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
        v[k + 't'] = y + '년 ' + m + '월';
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: off - 1 }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: off + 1 }); };
      } else if (c.k === 'act') {
        const done = get(k, 0);
        if (c.a === 'toast') v[k + 'k'] = (ev) => { pd(ev); toast(c.msg); };
        if (c.a === 'copy') {
          v[k + 't'] = done ? '복사했어요' : c.label;
          v[k + 'k'] = (ev) => {
            pd(ev);
            let t = c.text;
            if (c.codeFrom) t = t.replace(/maniball\.app\/j\/\w+/, 'maniball.app/j/' + get(c.codeFrom, 'TEST7Q'));
            try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) {}
            set({ [k]: 1 }); toast('복사했어요');
            setTimeout(() => this.setState({ [k]: 0 }), 1600);
          };
        }
        if (c.a === 'share') v[k + 'k'] = (ev) => {
          if (!c.nav) pd(ev);
          try { if (navigator.share) { navigator.share({ title: 'TEST FS', text: get('_msg', 'TEST FS 팀 관리 앱이에요. 링크 누르고 들어와요!'), url: 'https://maniball.app/j/TEST7Q' }).catch(() => {}); } } catch (e) {}
          toast('카카오톡 공유 창을 열었어요');
        };
        if (c.a === 'hide') { v[k + 'r'] = c.rs + (done ? '; display: none' : ''); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast(c.msg); }; }
        if (c.a === 'got') { v[k + 's'] = done ? c.s1 : c.s0; v[k + 't'] = done ? '받음 완료' : '받음'; v[k + 'k'] = (ev) => { pd(ev); if (!done) { set({ [k]: 1 }); toast('현금으로 받은 걸로 처리했어요'); } }; }
        if (c.a === 'link') { v[k + 't'] = get(k, c.code); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: Math.random().toString(36).slice(2, 8).toUpperCase() }); toast('새 링크를 만들었어요. 예전 링크는 막혔어요'); }; }
        if (c.a === 'readall') {
          (c.rows || []).forEach((r, i) => { v[k + '_' + i + 'r'] = done ? r.replace('background: #F0FDF4', 'background: #FFFFFF') : r; });
          (c.dots || []).forEach((d, i) => { v[k + '_' + i + 'd'] = done ? d.replace('background: #DC2626', 'background: transparent') : d; });
          v[k + 't'] = done ? '0개' : (c.cnt || '');
          v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast('모두 읽음으로 바꿨어요'); };
        }
        if (c.a === 'photo') {
          const url = get(k, '');
          v[k + 'ps'] = fix(c.ts) + (url ? '; background: center / cover no-repeat url(' + url + ')' : '');
          v[k + 'sv'] = url ? 'display: none' : '';
          v[k + 'pt'] = url ? '' : (c.pt || '');
          v[k + 'c'] = (ev) => { const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (f) { set({ [k]: URL.createObjectURL(f) }); toast('사진을 바꿨어요'); } };
        }
        if (c.a === 'selectall') v[k + 'k'] = (ev) => { pd(ev); const o = {}; T.forEach((x) => { if (x.k === 'chk') o[x.id] = true; }); set(o); toast('모두 골랐어요'); };
        if (c.a === 'edit') v[k + 'k'] = (ev) => { pd(ev); set({ _edit: !get('_edit', false) }); };
      }
    });
    const val = (id) => (byId[id] && byId[id].k === 'field' ? get(id, byId[id].val) : '');
    const pick = (id) => { const c = byId[id]; if (!c) return ''; const i = get(id, c.sel); return c.multi ? i.map((x) => c.labs[x]) : (i >= 0 ? c.labs[i] : ''); };
    const chk = (id) => { const c = byId[id]; return c ? get(id, c.on) : false; };

    const cms = get('_cm', []);
    v.comments = cms.map((x) => ({ t: x, vote: pick('c1') || '의견' }));
    v.addCm = (ev) => { pd(ev); const x = (val('c2') || '').trim(); if (!x) { toast('의견을 적어 주세요'); return; } set({ _cm: cms.concat([x]), ['c2']: '' }); toast('의견을 남겼어요. 운영진에게만 보여요'); };
    return v;
  }
}
</script>
<script src="proto.js"></script>
</body>
</html>
