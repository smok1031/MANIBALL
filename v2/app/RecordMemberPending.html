<div style="width: 100%; max-width: 480px; box-sizing: border-box; min-height: 100dvh; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #F6F7F9; display: flex; flex-direction: column; position: relative; word-break: keep-all">

    <span style="width: 44px"></span>

  <div style="padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">

      <b style="font-size: 22px; font-weight: 900">결과를 기다리고 있어요</b><span style="font-size: 14px; color: #4B5563; line-height: 1.6">운영진이 결과를 올리면 MOM 투표가 열리고<br>알림으로 알려 드려요</span>
