<body>
<div style="width: 100%; max-width: 480px; box-sizing: border-box; height: 100dvh; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; word-break: keep-all">
  <header style="height: 56px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #F3F4F6">
