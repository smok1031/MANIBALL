<style>
*{box-sizing:border-box}
html,body{margin:0;background:#E9ECEF}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:#111827;word-break:keep-all;-webkit-text-size-adjust:100%}
a{color:#15803D}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:#111827}
.page{max-width:480px;min-height:100dvh;margin:0 auto;background:#F6F7F9;display:flex;flex-direction:column;position:relative}
.top{position:sticky;top:0;z-index:5;background:#FFFFFF;display:flex;align-items:center;gap:8px;padding:6px 8px;min-height:56px;border-bottom:1px solid #F3F4F6}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1}
.iconbtn{width:44px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:#111827;text-decoration:none}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.card{background:#FFFFFF;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lab{font-size:14px;font-weight:700;color:#374151}
.hint{font-size:13px;color:#6B7280;line-height:1.5}
.muted{color:#6B7280}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #E5E7EB;background:#FFFFFF;color:#374151;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:500;min-height:44px}
.chip.on{background:#15803D;border-color:#15803D;color:#FFFFFF;font-weight:700}
.chip.sm{padding:6px 12px;min-height:36px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.inp{border:1px solid #D1D5DB;border-radius:12px;padding:12px 14px;background:#FFFFFF;font-size:16px;width:100%;outline:none}
.inp:focus{border-color:#15803D;box-shadow:0 0 0 3px rgba(21,128,61,0.15)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.6}
.btn{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;background:#F3F4F6;color:#111827;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.pri{background:#15803D;color:#FFFFFF}
.btn.kakao{background:#FEE500;color:#191600}
.btn.danger{background:#FEF2F2;color:#B91C1C}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;min-height:40px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.cta{position:sticky;bottom:0;background:#FFFFFF;border-top:1px solid #F3F4F6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:4}
.nav{position:sticky;bottom:0;z-index:5;background:#FFFFFF;border-top:1px solid #E5E7EB;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(10px + env(safe-area-inset-bottom));text-align:center}
.nav a{text-decoration:none;color:#6B7280;font-size:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav a.on{color:#15803D;font-weight:700}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-size:16px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#DCFCE7;color:#166534}
.tag.gray{background:#F3F4F6;color:#4B5563}
.tag.blue{background:#EEF2FF;color:#3730A3}
.datebox{width:52px;height:58px;border-radius:14px;background:#DCFCE7;color:#166534;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.datebox span{font-size:11px;font-weight:700}.datebox b{font-size:21px;line-height:1.1}
.datebox.gray{background:#F3F4F6;color:#6B7280}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vote{border:0;border-radius:12px;padding:12px 0;font-weight:700;font-size:15px;background:#F3F4F6;color:#111827;min-height:46px}
.vote.on{background:#15803D;color:#FFFFFF}
.vote.on.late{background:#B45309}
.vote.on.no{background:#4B5563}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F3F4F6}
.li:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:#EEF5F0;color:#1E6B45;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:12px;color:#6B7280}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#FFFFFF;border-radius:12px;padding:12px 16px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#FFFFFF;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:18px}
.loading{padding:80px 16px;text-align:center;color:#6B7280}
.hero{background:#1E6B45;color:#FFFFFF}
.err{background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px 12px;font-size:14px}
</style>
