<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>초대 2 단톡방 문구 미리보기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
</style>
</helmet>
<div style="width: 100%; max-width: 480px; box-sizing: border-box; height: 844px; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; word-break: keep-all">
  <header style="height: 56px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #F3F4F6"><span style="width: 44px"></span>
    <b style="font-size: 17px">팀원 초대하기</b>
    <a href="InviteRoster.dc.html" style="width: 44px; text-align: center; font-size: 15px; color: rgb(107, 114, 128); text-decoration: none; line-height: 44px">다음</a>
  </header>

  <div style="padding: 22px 20px 0">
    <span style="display: inline-block; background: #DCFCE7; color: #166534; font-weight: 700; font-size: 13px; padding: 5px 10px; border-radius: 999px">팀이 만들어졌어요</span>
    <h1 style="font-size: 24px; font-weight: 900; letter-spacing: -0.6px; margin: 12px 0 6px">단톡방에 이렇게 올라가요</h1>
    <p style="margin: 0; color: #4B5563; font-size: 14px">문구는 눌러서 바꿀 수 있어요.</p>
  </div>

  <div style="margin: 18px 20px 0; background: #B2C7DA; border-radius: 22px; padding: 18px 14px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; color: #374151">나</span>
    <div style="align-self: flex-start; width: 78%; max-width: 300px; background: #FFFFFF; border-radius: 4px 16px 16px 16px; overflow: hidden">
      <div style="background: {{accent}}; color: #FFFFFF; padding: 16px 14px; display: flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; font-weight: 900">T</span>
        <span><b style="font-size: 16px">TEST FS</b><br><span style="font-size: 12px; opacity: 0.85">풋살팀, 월회비 30,000원</span></span>
      </div>
      <div style="padding: 12px 14px; font-size: 14px; line-height: 1.6; border-bottom: 1px dashed #D1D5DB; position: relative"><sc-if value="{{ editOff }}" hint-placeholder-val="{{ true }}">{{ msgT }}</sc-if><sc-if value="{{ editOn }}" hint-placeholder-val="{{ false }}"><textarea aria-label="단톡방 문구" value="{{ msgT }}" onChange="{{ msgC }}" style="border: 1px solid #86EFAC; outline: none; background: #F0FDF4; font: inherit; color: #111827; margin: 0; box-sizing: border-box; border-radius: 8px; padding: 6px 8px 18px; width: 100%; display: block; resize: none; min-height: 96px; line-height: 1.6; font-size: 14px"></textarea></sc-if><a href="#" style="position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: {{accent}}; font-weight: 700; text-decoration: none" onClick="{{ c1k }}">{{ editLabel }}</a></div>
      <a href="JoinInvite.dc.html" style="display: block; padding: 12px 14px; text-align: center; font-weight: 700; font-size: 14px; color: #111827; text-decoration: none">팀 들어가기</a>
    </div>
  </div>

  <div style="margin: 16px 20px 0; display: flex; align-items: center; gap: 10px; border: 1px solid #E5E7EB; border-radius: 12px; padding: 12px 14px">
    <span style="flex: 1; font-size: 14px; font-weight: 700; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">maniball.app/j/TEST7Q</span>
    <a href="#" style="font-size: 14px; font-weight: 700; color: {{accent}}; text-decoration: none" onClick="{{ c2k }}">{{ c2t }}</a>
  </div>

  <div style="margin-top: auto; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #F3F4F6">
    <a href="InviteRoster.dc.html" style="display: block; text-decoration: none; background: #FEE500; color: #191919; font-weight: 700; font-size: 17px; padding: 16px 0; border-radius: 14px; text-align: center" onClick="{{ c3k }}">카카오톡 단톡방에 보내기</a>
    <span style="color: #6B7280; font-size: 13px; text-align: center">보낸 뒤 팀 홈으로 이동해요</span>
  </div>
  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50; width: max-content; max-width: 340px; box-sizing: border-box; background: #111827; color: #FFFFFF; font-size: 14px; font-weight: 700; line-height: 1.5; padding: 12px 16px; border-radius: 14px; text-align: center; box-shadow: 0 10px 24px rgba(17,24,39,0.25)">{{ toastText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D","options":["#15803D","#2563EB","#EA580C","#111827"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { /*maniball-interactive*/
    const A = this.props.accent ?? '#15803D';
    const S = this.state || {};
    const T = [{"id": "c1", "k": "act", "a": "edit"}, {"id": "c2", "k": "act", "a": "copy", "text": "maniball.app/j/TEST7Q", "label": "복사"}, {"id": "c3", "k": "act", "a": "share", "nav": true}];
    const fix = (x) => String(x == null ? '' : x).split('{{accent}}').join(A);
    const set = (o) => this.setState(o);
    const pd = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    const get = (k, d) => (S[k] === undefined ? d : S[k]);
    const v = { accent: A, toastOn: !!S._toast, toastText: S._toast || '' };
    const toast = (m) => { set({ _toast: m }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ _toast: '' }), 1800); };
    const byId = {};
    T.forEach((c) => { byId[c.id] = c; });
    T.forEach((c) => {
      const k = c.id;
      if (c.k === 'sel') {
        const cur = get(k, c.sel);
        c.els.forEach((e, i) => {
          const on = c.multi ? cur.indexOf(i) >= 0 : cur === i;
          v[k + '_' + i + 's'] = fix(on ? e.on : e.off);
          v[k + '_' + i + 'k'] = (ev) => {
            pd(ev);
            if (c.multi) { const a = cur.slice(); const j = a.indexOf(i); if (j >= 0) a.splice(j, 1); else a.push(i); set({ [k]: a }); }
            else set({ [k]: i });
          };
        });
      } else if (c.k === 'tog') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 'n'] = on ? c.non : c.noff;
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'chk') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 't'] = on ? '✓' : '';
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'step') {
        const n = get(k, c.val);
        v[k + 't'] = n + c.suf;
        if (c.bst !== undefined) v[k + 'bs'] = c.bst.replace(/color: #(D1D5DB|111827)/, 'color: ' + (n ? '#111827' : '#D1D5DB'));
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: Math.max(0, n - 1) }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: n + 1 }); };
      } else if (c.k === 'field') {
        v[k + 'v'] = get(k, c.val);
        v[k + 'c'] = (ev) => set({ [k]: ev && ev.target ? ev.target.value : '' });
      } else if (c.k === 'month') {
        const off = get(k, 0); let y = c.y, m = c.m + off;
        while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
        v[k + 't'] = y + '년 ' + m + '월';
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: off - 1 }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: off + 1 }); };
      } else if (c.k === 'act') {
        const done = get(k, 0);
        if (c.a === 'toast') v[k + 'k'] = (ev) => { pd(ev); toast(c.msg); };
        if (c.a === 'copy') {
          v[k + 't'] = done ? '복사했어요' : c.label;
          v[k + 'k'] = (ev) => {
            pd(ev);
            let t = c.text;
            if (c.codeFrom) t = t.replace(/maniball\.app\/j\/\w+/, 'maniball.app/j/' + get(c.codeFrom, 'TEST7Q'));
            try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) {}
            set({ [k]: 1 }); toast('복사했어요');
            setTimeout(() => this.setState({ [k]: 0 }), 1600);
          };
        }
        if (c.a === 'share') v[k + 'k'] = (ev) => {
          if (!c.nav) pd(ev);
          try { if (navigator.share) { navigator.share({ title: 'TEST FS', text: get('_msg', 'TEST FS 팀 관리 앱이에요. 링크 누르고 들어와요!'), url: 'https://maniball.app/j/TEST7Q' }).catch(() => {}); } } catch (e) {}
          toast('카카오톡 공유 창을 열었어요');
        };
        if (c.a === 'hide') { v[k + 'r'] = c.rs + (done ? '; display: none' : ''); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast(c.msg); }; }
        if (c.a === 'got') { v[k + 's'] = done ? c.s1 : c.s0; v[k + 't'] = done ? '받음 완료' : '받음'; v[k + 'k'] = (ev) => { pd(ev); if (!done) { set({ [k]: 1 }); toast('현금으로 받은 걸로 처리했어요'); } }; }
        if (c.a === 'link') { v[k + 't'] = get(k, c.code); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: Math.random().toString(36).slice(2, 8).toUpperCase() }); toast('새 링크를 만들었어요. 예전 링크는 막혔어요'); }; }
        if (c.a === 'readall') {
          (c.rows || []).forEach((r, i) => { v[k + '_' + i + 'r'] = done ? r.replace('background: #F0FDF4', 'background: #FFFFFF') : r; });
          (c.dots || []).forEach((d, i) => { v[k + '_' + i + 'd'] = done ? d.replace('background: #DC2626', 'background: transparent') : d; });
          v[k + 't'] = done ? '0개' : (c.cnt || '');
          v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast('모두 읽음으로 바꿨어요'); };
        }
        if (c.a === 'photo') {
          const url = get(k, '');
          v[k + 'ps'] = fix(c.ts) + (url ? '; background: center / cover no-repeat url(' + url + ')' : '');
          v[k + 'sv'] = url ? 'display: none' : '';
          v[k + 'pt'] = url ? '' : (c.pt || '');
          v[k + 'c'] = (ev) => { const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (f) { set({ [k]: URL.createObjectURL(f) }); toast('사진을 바꿨어요'); } };
        }
        if (c.a === 'selectall') v[k + 'k'] = (ev) => { pd(ev); const o = {}; T.forEach((x) => { if (x.k === 'chk') o[x.id] = true; }); set(o); toast('모두 골랐어요'); };
        if (c.a === 'edit') v[k + 'k'] = (ev) => { pd(ev); set({ _edit: !get('_edit', false) }); };
      }
    });
    const val = (id) => (byId[id] && byId[id].k === 'field' ? get(id, byId[id].val) : '');
    const pick = (id) => { const c = byId[id]; if (!c) return ''; const i = get(id, c.sel); return c.multi ? i.map((x) => c.labs[x]) : (i >= 0 ? c.labs[i] : ''); };
    const chk = (id) => { const c = byId[id]; return c ? get(id, c.on) : false; };

    v.editOn = !!get('_edit', false); v.editOff = !v.editOn; v.editLabel = v.editOn ? '완료' : '수정';
    v.msgT = get('_msg', "TEST FS 팀 관리 앱이에요. 링크 누르고 카카오로 로그인하면 끝! 이제 참석은 여기서 눌러 주세요."); v.msgC = (ev) => set({ _msg: ev.target.value });
    return v;
  }
}
</script>
</body>
</html>
