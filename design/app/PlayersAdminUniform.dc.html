<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팀 유니폼</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#15803D}
</style>
</helmet>
<div style="width: 100%; max-width: 480px; box-sizing: border-box; min-height: 844px; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #F6F7F9; display: flex; flex-direction: column; position: relative; word-break: keep-all">
  <header style="position: sticky; top: 0; z-index: 3; background: #FFFFFF; border-bottom: 1px solid #F3F4F6; height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="PlayersAdmin.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <b style="flex: 1; font-size: 17px">팀 유니폼</b>
    <span style="width: 44px"></span>
  </header>
  <div style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; gap: 14px; padding: 22px 16px">
      <span data-photo="1" style="{{ c2ps }}"><svg width="154" height="154" viewBox="0 0 100 100" aria-hidden="true" style="{{ c2sv }}"><path d="M30 12 L40 8 Q50 17 60 8 L70 12 L93 27 L84 45 L74 40 L74 92 Q50 97 26 92 L26 40 L16 45 L7 27 Z" fill="#1E6B45"></path><path d="M40 8 Q50 21 60 8" fill="none" stroke="#F5B841" stroke-width="3"></path><path d="M7 27 L16 45 M93 27 L84 45" stroke="#F5B841" stroke-width="3"></path></svg><b data-num="1" style="{{ numSt }}">{{ cdNum }}</b></span>
      <span style="font-size: 13px; color: #6B7280; text-align: center; line-height: 1.5">팀원마다 자기 등번호가 들어가요<br>예시는 정성목 7번</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%"><label style="display: block; text-decoration: none; text-align: center; background: #F3F4F6; color: #111827; font-weight: 700; font-size: 15px; padding: 14px 0; border-radius: 14px; font-size: 14px; padding: 12px 0; cursor: pointer">사진 고르기<input type="file" accept="image/*" onChange="{{ c2c }}" style="display: none"></label><label style="display: block; text-decoration: none; text-align: center; background: #F3F4F6; color: #111827; font-weight: 700; font-size: 15px; padding: 14px 0; border-radius: 14px; font-size: 14px; padding: 12px 0; cursor: pointer">사진 찍기<input type="file" accept="image/*" capture="environment" onChange="{{ c3c }}" style="display: none"></label></div>
    </div>
    <section style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 900; color: #6B7280; display: flex; justify-content: space-between">번호 색<span style="font-weight: 500"></span></span><div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 700"><a href="#" style="{{ c1_0s }}" onClick="{{ c1_0k }}">흰색</a><a href="#" style="{{ c1_1s }}" onClick="{{ c1_1k }}">검정</a><a href="#" style="{{ c1_2s }}" onClick="{{ c1_2k }}">노랑</a></div></section>
    <div style="display: flex; gap: 10px; align-items: flex-start; background: #FFFFFF; border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #4B5563"><b style="flex: none; color: #111827">팁</b><span>번호가 없는 앞면 사진이 가장 잘 나와요. 사진을 안 올리면 팀 색 기본 유니폼으로 보여요.</span></div>
    <p style="margin: 0; font-size: 13px; color: #6B7280; line-height: 1.5">팀원 홈 화면의 선수 카드와 가입할 때 선수 등록 화면에 쓰여요.</p>
  </div>
  <div style="position: sticky; bottom: 0; margin-top: auto; background: #FFFFFF; border-top: 1px solid #F3F4F6; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 8px">
    <a href="PlayersAdmin.dc.html" style="display: block; text-decoration: none; text-align: center; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 15px 0; border-radius: 14px">저장하기</a>
  </div>
  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50; width: max-content; max-width: 340px; box-sizing: border-box; background: #111827; color: #FFFFFF; font-size: 14px; font-weight: 700; line-height: 1.5; padding: 12px 16px; border-radius: 14px; text-align: center; box-shadow: 0 10px 24px rgba(17,24,39,0.25)">{{ toastText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D","options":["#15803D","#1E6B45","#2563EB","#111827"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { /*maniball-interactive*/
    const A = this.props.accent ?? '#15803D';
    const S = this.state || {};
    const T = [{"id": "c1", "k": "sel", "multi": false, "sel": 0, "els": [{"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}], "labs": ["흰색", "검정", "노랑"]}, {"id": "c2", "k": "act", "a": "photo", "ts": "position: relative; width: 180px; height: 180px; border-radius: 16px; background: #EEF5F0; display: inline-flex; align-items: center; justify-content: center; flex: none; overflow: hidden"}, {"id": "c3", "k": "act", "a": "photo", "ts": "position: relative; width: 180px; height: 180px; border-radius: 16px; background: #EEF5F0; display: inline-flex; align-items: center; justify-content: center; flex: none; overflow: hidden"}, {"id": "nums", "k": "meta", "st": "position: absolute; left: 0; right: 0; top: 44%; text-align: center; color: #FFFFFF; font-size: 54px; font-weight: 900; line-height: 1; letter-spacing: -1px"}];
    const fix = (x) => String(x == null ? '' : x).split('{{accent}}').join(A);
    const set = (o) => this.setState(o);
    const pd = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    const get = (k, d) => (S[k] === undefined ? d : S[k]);
    const v = { accent: A, toastOn: !!S._toast, toastText: S._toast || '' };
    const toast = (m) => { set({ _toast: m }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ _toast: '' }), 1800); };
    const byId = {};
    T.forEach((c) => { byId[c.id] = c; });
    T.forEach((c) => {
      const k = c.id;
      if (c.k === 'sel') {
        const cur = get(k, c.sel);
        c.els.forEach((e, i) => {
          const on = c.multi ? cur.indexOf(i) >= 0 : cur === i;
          v[k + '_' + i + 's'] = fix(on ? e.on : e.off);
          v[k + '_' + i + 'k'] = (ev) => {
            pd(ev);
            if (c.multi) { const a = cur.slice(); const j = a.indexOf(i); if (j >= 0) a.splice(j, 1); else a.push(i); set({ [k]: a }); }
            else set({ [k]: i });
          };
        });
      } else if (c.k === 'tog') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 'n'] = on ? c.non : c.noff;
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'chk') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 't'] = on ? '✓' : '';
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'step') {
        const n = get(k, c.val);
        v[k + 't'] = n + c.suf;
        if (c.bst !== undefined) v[k + 'bs'] = c.bst.replace(/color: #(D1D5DB|111827)/, 'color: ' + (n ? '#111827' : '#D1D5DB'));
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: Math.max(0, n - 1) }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: n + 1 }); };
      } else if (c.k === 'field') {
        v[k + 'v'] = get(k, c.val);
        v[k + 'c'] = (ev) => set({ [k]: ev && ev.target ? ev.target.value : '' });
      } else if (c.k === 'month') {
        const off = get(k, 0); let y = c.y, m = c.m + off;
        while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
        v[k + 't'] = y + '년 ' + m + '월';
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: off - 1 }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: off + 1 }); };
      } else if (c.k === 'act') {
        const done = get(k, 0);
        if (c.a === 'toast') v[k + 'k'] = (ev) => { pd(ev); toast(c.msg); };
        if (c.a === 'copy') {
          v[k + 't'] = done ? '복사했어요' : c.label;
          v[k + 'k'] = (ev) => {
            pd(ev);
            let t = c.text;
            if (c.codeFrom) t = t.replace(/maniball\.app\/j\/\w+/, 'maniball.app/j/' + get(c.codeFrom, 'TEST7Q'));
            try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) {}
            set({ [k]: 1 }); toast('복사했어요');
            setTimeout(() => this.setState({ [k]: 0 }), 1600);
          };
        }
        if (c.a === 'share') v[k + 'k'] = (ev) => {
          if (!c.nav) pd(ev);
          try { if (navigator.share) { navigator.share({ title: 'TEST FS', text: get('_msg', 'TEST FS 팀 관리 앱이에요. 링크 누르고 들어와요!'), url: 'https://maniball.app/j/TEST7Q' }).catch(() => {}); } } catch (e) {}
          toast('카카오톡 공유 창을 열었어요');
        };
        if (c.a === 'hide') { v[k + 'r'] = c.rs + (done ? '; display: none' : ''); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast(c.msg); }; }
        if (c.a === 'got') { v[k + 's'] = done ? c.s1 : c.s0; v[k + 't'] = done ? '받음 완료' : '받음'; v[k + 'k'] = (ev) => { pd(ev); if (!done) { set({ [k]: 1 }); toast('현금으로 받은 걸로 처리했어요'); } }; }
        if (c.a === 'link') { v[k + 't'] = get(k, c.code); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: Math.random().toString(36).slice(2, 8).toUpperCase() }); toast('새 링크를 만들었어요. 예전 링크는 막혔어요'); }; }
        if (c.a === 'readall') {
          (c.rows || []).forEach((r, i) => { v[k + '_' + i + 'r'] = done ? r.replace('background: #F0FDF4', 'background: #FFFFFF') : r; });
          (c.dots || []).forEach((d, i) => { v[k + '_' + i + 'd'] = done ? d.replace('background: #DC2626', 'background: transparent') : d; });
          v[k + 't'] = done ? '0개' : (c.cnt || '');
          v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast('모두 읽음으로 바꿨어요'); };
        }
        if (c.a === 'photo') {
          const url = get(k, '');
          v[k + 'ps'] = fix(c.ts) + (url ? '; background: center / cover no-repeat url(' + url + ')' : '');
          v[k + 'sv'] = url ? 'display: none' : '';
          v[k + 'pt'] = url ? '' : (c.pt || '');
          v[k + 'c'] = (ev) => { const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (f) { set({ [k]: URL.createObjectURL(f) }); toast('사진을 바꿨어요'); } };
        }
        if (c.a === 'selectall') v[k + 'k'] = (ev) => { pd(ev); const o = {}; T.forEach((x) => { if (x.k === 'chk') o[x.id] = true; }); set(o); toast('모두 골랐어요'); };
        if (c.a === 'edit') v[k + 'k'] = (ev) => { pd(ev); set({ _edit: !get('_edit', false) }); };
      }
    });
    const val = (id) => (byId[id] && byId[id].k === 'field' ? get(id, byId[id].val) : '');
    const pick = (id) => { const c = byId[id]; if (!c) return ''; const i = get(id, c.sel); return c.multi ? i.map((x) => c.labs[x]) : (i >= 0 ? c.labs[i] : ''); };
    const chk = (id) => { const c = byId[id]; return c ? get(id, c.on) : false; };

    v.numSt = byId.nums.st.replace(/color: #[0-9A-Fa-f]+/, 'color: ' + ({ '흰색': '#FFFFFF', '검정': '#111827', '노랑': '#F5B841' }[pick('c1')] || '#FFFFFF'));
    v.cdName = val('None') || ' '; v.cdNum = (val('None') || '').replace(/\D/g, '');
    return v;
  }
}
</script>
</body>
</html>
