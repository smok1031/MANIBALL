<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>출석 마감 뒤</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#15803D}
</style>
</helmet>
<div style="width: 100%; max-width: 480px; box-sizing: border-box; min-height: 844px; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #F6F7F9; display: flex; flex-direction: column; position: relative; word-break: keep-all">
  <header style="position: sticky; top: 0; z-index: 3; background: #FFFFFF; border-bottom: 1px solid #F3F4F6; height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="ScheduleAdmin.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <b style="flex: 1; font-size: 17px">현장 출석</b>
    <span style="width: 44px"></span>
  </header>
  <div style="padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px; align-items: center; background: #DCFCE7; color: #166534; border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 700"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex: none">✓</span><span>벌금을 매기고 팀원 앱에 알렸어요</span></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px"><b style="font-size: 16px">11.15 경기 출석 마감</b>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center"><span style="background: #F9FAFB; border-radius: 14px; padding: 10px 0"><b style="display: block; font-size: 18px; font-weight: 900">7</b><span style="font-size: 12px; color: #6B7280">출석</span></span><span style="background: #F9FAFB; border-radius: 14px; padding: 10px 0"><b style="display: block; font-size: 18px; font-weight: 900">2</b><span style="font-size: 12px; color: #6B7280">지각</span></span><span style="background: #F9FAFB; border-radius: 14px; padding: 10px 0"><b style="display: block; font-size: 18px; font-weight: 900">1</b><span style="font-size: 12px; color: #6B7280">결석</span></span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; border-top: 1px solid #F3F4F6; padding-top: 12px"><span>매긴 벌금</span><b style="color: #B91C1C">14,000원</b></div>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 10px"><div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 15px">단톡방에 올릴 문구</b><a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none" onClick="{{ c1k }}">{{ c1t }}</a></div><span style="background: #F9FAFB; border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.6">[TEST FS] 11.15 경기 벌금 안내<br>지각 2,000원: 정우진, 신재원<br>무단 결석 10,000원: 황민재<br>회비 탭에서 확인하고 보내 주세요.</span></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><a href="DuesAdmin.dc.html" style="display: block; text-decoration: none; text-align: center; background: #F3F4F6; color: #111827; font-weight: 700; font-size: 15px; padding: 14px 0; border-radius: 14px">회비에서 보기</a><a href="ScheduleAdmin.dc.html" style="display: block; text-decoration: none; text-align: center; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 15px 0; border-radius: 14px; font-size: 15px; padding: 14px 0">일정으로</a></div>
  </div>
  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50; width: max-content; max-width: 340px; box-sizing: border-box; background: #111827; color: #FFFFFF; font-size: 14px; font-weight: 700; line-height: 1.5; padding: 12px 16px; border-radius: 14px; text-align: center; box-shadow: 0 10px 24px rgba(17,24,39,0.25)">{{ toastText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D","options":["#15803D","#1E6B45","#2563EB","#111827"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { /*maniball-interactive*/
    const A = this.props.accent ?? '#15803D';
    const S = this.state || {};
    const T = [{"id": "c1", "k": "act", "a": "copy", "text": "단톡방에 올릴 문구", "label": "복사"}];
    const fix = (x) => String(x == null ? '' : x).split('{{accent}}').join(A);
    const set = (o) => this.setState(o);
    const pd = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    const get = (k, d) => (S[k] === undefined ? d : S[k]);
    const v = { accent: A, toastOn: !!S._toast, toastText: S._toast || '' };
    const toast = (m) => { set({ _toast: m }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ _toast: '' }), 1800); };
    const byId = {};
    T.forEach((c) => { byId[c.id] = c; });
    T.forEach((c) => {
      const k = c.id;
      if (c.k === 'sel') {
        const cur = get(k, c.sel);
        c.els.forEach((e, i) => {
          const on = c.multi ? cur.indexOf(i) >= 0 : cur === i;
          v[k + '_' + i + 's'] = fix(on ? e.on : e.off);
          v[k + '_' + i + 'k'] = (ev) => {
            pd(ev);
            if (c.multi) { const a = cur.slice(); const j = a.indexOf(i); if (j >= 0) a.splice(j, 1); else a.push(i); set({ [k]: a }); }
            else set({ [k]: i });
          };
        });
      } else if (c.k === 'tog') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 'n'] = on ? c.non : c.noff;
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'chk') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 't'] = on ? '✓' : '';
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'step') {
        const n = get(k, c.val);
        v[k + 't'] = n + c.suf;
        if (c.bst !== undefined) v[k + 'bs'] = c.bst.replace(/color: #(D1D5DB|111827)/, 'color: ' + (n ? '#111827' : '#D1D5DB'));
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: Math.max(0, n - 1) }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: n + 1 }); };
      } else if (c.k === 'field') {
        v[k + 'v'] = get(k, c.val);
        v[k + 'c'] = (ev) => set({ [k]: ev && ev.target ? ev.target.value : '' });
      } else if (c.k === 'month') {
        const off = get(k, 0); let y = c.y, m = c.m + off;
        while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
        v[k + 't'] = y + '년 ' + m + '월';
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: off - 1 }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: off + 1 }); };
      } else if (c.k === 'act') {
        const done = get(k, 0);
        if (c.a === 'toast') v[k + 'k'] = (ev) => { pd(ev); toast(c.msg); };
        if (c.a === 'copy') {
          v[k + 't'] = done ? '복사했어요' : c.label;
          v[k + 'k'] = (ev) => {
            pd(ev);
            let t = c.text;
            if (c.codeFrom) t = t.replace(/maniball\.app\/j\/\w+/, 'maniball.app/j/' + get(c.codeFrom, 'TEST7Q'));
            try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) {}
            set({ [k]: 1 }); toast('복사했어요');
            setTimeout(() => this.setState({ [k]: 0 }), 1600);
          };
        }
        if (c.a === 'share') v[k + 'k'] = (ev) => {
          if (!c.nav) pd(ev);
          try { if (navigator.share) { navigator.share({ title: 'TEST FS', text: get('_msg', 'TEST FS 팀 관리 앱이에요. 링크 누르고 들어와요!'), url: 'https://maniball.app/j/TEST7Q' }).catch(() => {}); } } catch (e) {}
          toast('카카오톡 공유 창을 열었어요');
        };
        if (c.a === 'hide') { v[k + 'r'] = c.rs + (done ? '; display: none' : ''); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast(c.msg); }; }
        if (c.a === 'got') { v[k + 's'] = done ? c.s1 : c.s0; v[k + 't'] = done ? '받음 완료' : '받음'; v[k + 'k'] = (ev) => { pd(ev); if (!done) { set({ [k]: 1 }); toast('현금으로 받은 걸로 처리했어요'); } }; }
        if (c.a === 'link') { v[k + 't'] = get(k, c.code); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: Math.random().toString(36).slice(2, 8).toUpperCase() }); toast('새 링크를 만들었어요. 예전 링크는 막혔어요'); }; }
        if (c.a === 'readall') {
          (c.rows || []).forEach((r, i) => { v[k + '_' + i + 'r'] = done ? r.replace('background: #F0FDF4', 'background: #FFFFFF') : r; });
          (c.dots || []).forEach((d, i) => { v[k + '_' + i + 'd'] = done ? d.replace('background: #DC2626', 'background: transparent') : d; });
          v[k + 't'] = done ? '0개' : (c.cnt || '');
          v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast('모두 읽음으로 바꿨어요'); };
        }
        if (c.a === 'photo') {
          const url = get(k, '');
          v[k + 'ps'] = fix(c.ts) + (url ? '; background: center / cover no-repeat url(' + url + ')' : '');
          v[k + 'sv'] = url ? 'display: none' : '';
          v[k + 'pt'] = url ? '' : (c.pt || '');
          v[k + 'c'] = (ev) => { const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (f) { set({ [k]: URL.createObjectURL(f) }); toast('사진을 바꿨어요'); } };
        }
        if (c.a === 'selectall') v[k + 'k'] = (ev) => { pd(ev); const o = {}; T.forEach((x) => { if (x.k === 'chk') o[x.id] = true; }); set(o); toast('모두 골랐어요'); };
        if (c.a === 'edit') v[k + 'k'] = (ev) => { pd(ev); set({ _edit: !get('_edit', false) }); };
      }
    });
    const val = (id) => (byId[id] && byId[id].k === 'field' ? get(id, byId[id].val) : '');
    const pick = (id) => { const c = byId[id]; if (!c) return ''; const i = get(id, c.sel); return c.multi ? i.map((x) => c.labs[x]) : (i >= 0 ? c.labs[i] : ''); };
    const chk = (id) => { const c = byId[id]; return c ? get(id, c.on) : false; };


    return v;
  }
}
</script>
</body>
</html>
