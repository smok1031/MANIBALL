<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">

body{margin:0;background:#FFFFFF}

</helmet>
<div style="width: 100%; max-width: 480px; box-sizing: border-box; min-height: 844px; margin: 0 auto; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #F6F7F9; display: flex; flex-direction: column; position: relative; word-break: keep-all">
  <header style="position: sticky; top: 0; z-index: 3; background: #FFFFFF; border-bottom: 1px solid #F3F4F6; height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="PlayersAdmin.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <b style="flex: 1; font-size: 17px">팀 수칙 수정</b>
    <span style="width: 44px"></span>
  </header>
  <div style="padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 0"><div style="{{ c2r }}"><span style="flex: 1; font-size: 15px"><b>지각</b><br><span style="color: #6B7280; font-size: 12px">킥오프 10분 전 기준</span></span><span style="border: 1px solid #D1D5DB; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px"><input aria-label="입력" value="{{ c6v }}" onChange="{{ c6c }}" style="border: 0; outline: none; background: transparent; font: inherit; color: #111827; padding: 0; margin: 0; min-width: 0; width: 100%; flex: 1"></span><a href="#" style="font-size: 13px; color: #B91C1C; text-decoration: none; padding: 8px 0 8px 4px" onClick="{{ c2k }}">삭제</a></div><div style="{{ c3r }}"><span style="flex: 1; font-size: 15px"><b>무단 결석</b></span><span style="border: 1px solid #D1D5DB; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px"><input aria-label="입력" value="{{ c7v }}" onChange="{{ c7c }}" style="border: 0; outline: none; background: transparent; font: inherit; color: #111827; padding: 0; margin: 0; min-width: 0; width: 100%; flex: 1"></span><a href="#" style="font-size: 13px; color: #B91C1C; text-decoration: none; padding: 8px 0 8px 4px" onClick="{{ c3k }}">삭제</a></div><div style="{{ c4r }}"><span style="flex: 1; font-size: 15px"><b>직전 취소</b><br><span style="color: #6B7280; font-size: 12px">전날 21시 이후</span></span><span style="border: 1px solid #D1D5DB; border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px"><input aria-label="입력" value="{{ c8v }}" onChange="{{ c8c }}" style="border: 0; outline: none; background: transparent; font: inherit; color: #111827; padding: 0; margin: 0; min-width: 0; width: 100%; flex: 1"></span><a href="#" style="font-size: 13px; color: #B91C1C; text-decoration: none; padding: 8px 0 8px 4px" onClick="{{ c4k }}">삭제</a></div><div style="{{ c5r }}"><span style="flex: 1; font-size: 15px"><b>구장 정리는 다 같이 해요</b></span><span style="font-size: 12px; color: #6B7280">글 수칙</span><a href="#" style="font-size: 13px; color: #B91C1C; text-decoration: none; padding: 8px 0 8px 4px" onClick="{{ c5k }}">삭제</a></div><sc-for list="{{ added }}" as="r" hint-placeholder-count="0"><div style="display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F3F4F6"><input aria-label="새 수칙 이름" placeholder="새 수칙" value="{{ r.nv }}" onChange="{{ r.nc }}" style="border: 0; outline: none; background: transparent; font: inherit; color: #111827; padding: 0; margin: 0; min-width: 0; flex: 1; font-size: 15px; font-weight: 700"><input aria-label="벌금" placeholder="0원" value="{{ r.av }}" onChange="{{ r.ac }}" style="border: 1px solid #D1D5DB; border-radius: 10px; padding: 8px 10px; font: inherit; font-weight: 700; font-size: 14px; width: 84px; outline: none"></div></sc-for><a href="#" style="padding: 14px 0 2px; font-weight: 700; text-decoration: none" onClick="{{ addRule }}">+ 수칙 추가</a></div>
    <div style="display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border-radius: 16px; padding: 14px; gap: 12px"><span><b style="font-size: 15px">팀원에게 다시 동의 받기</b><br><span style="font-size: 12px; color: #6B7280">저장하면 팀원이 다음에 들어올 때 바뀐 수칙에 동의해요</span></span><a href="#" aria-label="팀원에게 켜고 끄기" style="{{ c1s }}" onClick="{{ c1k }}"><span style="{{ c1n }}"></span></a></div>
    <p style="margin: 0; font-size: 13px; color: #6B7280; line-height: 1.5">벌금 금액을 바꾸면 그 다음 일정부터 적용돼요. 이미 매긴 벌금은 그대로예요.</p>
  </div>
  <div style="position: sticky; bottom: 0; margin-top: auto; background: #FFFFFF; border-top: 1px solid #F3F4F6; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 8px">
    <a href="PlayersAdmin.dc.html" style="display: block; text-decoration: none; text-align: center; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 15px 0; border-radius: 14px">저장하기</a>
  </div>
  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}"><div role="status" style="position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 50; width: max-content; max-width: 340px; box-sizing: border-box; background: #111827; color: #FFFFFF; font-size: 14px; font-weight: 700; line-height: 1.5; padding: 12px 16px; border-radius: 14px; text-align: center; box-shadow: 0 10px 24px rgba(17,24,39,0.25)">{{ toastText }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D","options":["#15803D","#1E6B45","#2563EB","#111827"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { /*maniball-interactive*/
    const A = this.props.accent ?? '#15803D';
    const S = this.state || {};
    const T = [{"id": "c1", "k": "tog", "on": true, "son": "width: 46px; height: 26px; border-radius: 999px; background: {{accent}}; position: relative; flex: none; display: inline-block", "soff": "width: 46px; height: 26px; border-radius: 999px; background: #D1D5DB; position: relative; flex: none; display: inline-block", "non": "position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF", "noff": "position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"}, {"id": "c2", "k": "act", "a": "hide", "msg": "수칙을 지웠어요. 저장하면 반영돼요", "rs": "display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F3F4F6"}, {"id": "c3", "k": "act", "a": "hide", "msg": "수칙을 지웠어요. 저장하면 반영돼요", "rs": "display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F3F4F6"}, {"id": "c4", "k": "act", "a": "hide", "msg": "수칙을 지웠어요. 저장하면 반영돼요", "rs": "display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F3F4F6"}, {"id": "c5", "k": "act", "a": "hide", "msg": "수칙을 지웠어요. 저장하면 반영돼요", "rs": "display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #F3F4F6"}, {"id": "c6", "k": "field", "val": "2,000원", "label": "입력", "node": 1573}, {"id": "c7", "k": "field", "val": "10,000원", "label": "입력", "node": 1980}, {"id": "c8", "k": "field", "val": "5,000원", "label": "입력", "node": 2454}];
    const fix = (x) => String(x == null ? '' : x).split('{{accent}}').join(A);
    const set = (o) => this.setState(o);
    const pd = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    const get = (k, d) => (S[k] === undefined ? d : S[k]);
    const v = { accent: A, toastOn: !!S._toast, toastText: S._toast || '' };
    const toast = (m) => { set({ _toast: m }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ _toast: '' }), 1800); };
    const byId = {};
    T.forEach((c) => { byId[c.id] = c; });
    T.forEach((c) => {
      const k = c.id;
      if (c.k === 'sel') {
        const cur = get(k, c.sel);
        c.els.forEach((e, i) => {
          const on = c.multi ? cur.indexOf(i) >= 0 : cur === i;
          v[k + '_' + i + 's'] = fix(on ? e.on : e.off);
          v[k + '_' + i + 'k'] = (ev) => {
            pd(ev);
            if (c.multi) { const a = cur.slice(); const j = a.indexOf(i); if (j >= 0) a.splice(j, 1); else a.push(i); set({ [k]: a }); }
            else set({ [k]: i });
          };
        });
      } else if (c.k === 'tog') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 'n'] = on ? c.non : c.noff;
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'chk') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 't'] = on ? '✓' : '';
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'step') {
        const n = get(k, c.val);
        v[k + 't'] = n + c.suf;
        if (c.bst !== undefined) v[k + 'bs'] = c.bst.replace(/color: #(D1D5DB|111827)/, 'color: ' + (n ? '#111827' : '#D1D5DB'));
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: Math.max(0, n - 1) }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: n + 1 }); };
      } else if (c.k === 'field') {
        v[k + 'v'] = get(k, c.val);
        v[k + 'c'] = (ev) => set({ [k]: ev && ev.target ? ev.target.value : '' });
      } else if (c.k === 'month') {
        const off = get(k, 0); let y = c.y, m = c.m + off;
        while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
        v[k + 't'] = y + '년 ' + m + '월';
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: off - 1 }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: off + 1 }); };
      } else if (c.k === 'act') {
        const done = get(k, 0);
        if (c.a === 'toast') v[k + 'k'] = (ev) => { pd(ev); toast(c.msg); };
        if (c.a === 'copy') {
          v[k + 't'] = done ? '복사했어요' : c.label;
          v[k + 'k'] = (ev) => {
            pd(ev);
            let t = c.text;
            if (c.codeFrom) t = t.replace(/maniball\.app\/j\/\w+/, 'maniball.app/j/' + get(c.codeFrom, 'TEST7Q'));
            try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) {}
            set({ [k]: 1 }); toast('복사했어요');
            setTimeout(() => this.setState({ [k]: 0 }), 1600);
          };
        }
        if (c.a === 'share') v[k + 'k'] = (ev) => {
          if (!c.nav) pd(ev);
          try { if (navigator.share) { navigator.share({ title: 'TEST FS', text: get('_msg', 'TEST FS 팀 관리 앱이에요. 링크 누르고 들어와요!'), url: 'https://maniball.app/j/TEST7Q' }).catch(() => {}); } } catch (e) {}
          toast('공유 창을 열었어요');
        };
        if (c.a === 'hide') { v[k + 'r'] = c.rs + (done ? '; display: none' : ''); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast(c.msg); }; }
        if (c.a === 'got') { v[k + 's'] = done ? c.s1 : c.s0; v[k + 't'] = done ? '받음 완료' : '받음'; v[k + 'k'] = (ev) => { pd(ev); if (!done) { set({ [k]: 1 }); toast('현금으로 받은 걸로 처리했어요'); } }; }
        if (c.a === 'link') { v[k + 't'] = get(k, c.code); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: Math.random().toString(36).slice(2, 8).toUpperCase() }); toast('새 링크를 만들었어요. 예전 링크는 막혔어요'); }; }
        if (c.a === 'readall') {
          (c.rows || []).forEach((r, i) => { v[k + '_' + i + 'r'] = done ? r.replace('background: #F0FDF4', 'background: #FFFFFF') : r; });
          (c.dots || []).forEach((d, i) => { v[k + '_' + i + 'd'] = done ? d.replace('background: #DC2626', 'background: transparent') : d; });
          v[k + 't'] = done ? '0개' : (c.cnt || '');
          v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast('모두 읽음으로 바꿨어요'); };
        }
        if (c.a === 'photo') {
          const url = get(k, '');
          v[k + 'ps'] = fix(c.ts) + (url ? '; background: center / cover no-repeat url(' + url + ')' : '');
          v[k + 'sv'] = url ? 'display: none' : '';
          v[k + 'pt'] = url ? '' : (c.pt || '');
          v[k + 'c'] = (ev) => { const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (f) { set({ [k]: URL.createObjectURL(f) }); toast('사진을 바꿨어요'); } };
        }
        if (c.a === 'selectall') v[k + 'k'] = (ev) => { pd(ev); const o = {}; T.forEach((x) => { if (x.k === 'chk') o[x.id] = true; }); set(o); toast('모두 골랐어요'); };
        if (c.a === 'edit') v[k + 'k'] = (ev) => { pd(ev); set({ _edit: !get('_edit', false) }); };
      }
    });
    const val = (id) => (byId[id] && byId[id].k === 'field' ? get(id, byId[id].val) : '');
    const pick = (id) => { const c = byId[id]; if (!c) return ''; const i = get(id, c.sel); return c.multi ? i.map((x) => c.labs[x]) : (i >= 0 ? c.labs[i] : ''); };
    const chk = (id) => { const c = byId[id]; return c ? get(id, c.on) : false; };

    const added = get('_rules', []);
    v.added = added.map((r, i) => ({ nv: r.n, av: r.a, nc: (ev) => { const a = added.slice(); a[i] = { ...a[i], n: ev.target.value }; set({ _rules: a }); }, ac: (ev) => { const a = added.slice(); a[i] = { ...a[i], a: ev.target.value }; set({ _rules: a }); } }));
    v.addRule = (ev) => { pd(ev); set({ _rules: added.concat([{ n: '', a: '' }]) }); };
    return v;
  }
}
</script>
</body>
