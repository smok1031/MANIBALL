    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; gap: 8px; padding: 22px 16px">
      <span style="width: 64px; height: 64px; border-radius: 50%; background: #F3F4F6; color: #374151; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; flex: none">조</span>
      <span style="display: flex; gap: 6px; align-items: center"><b style="font-size: 21px">조현우</b><span style="background: #F3F4F6; color: #374151; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; flex: none">운영진</span><span style="background: #FEE2E2; color: #B91C1C; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; flex: none">2달 미납</span></span>

    </div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 15px">이번 시즌</b><a href="RecordAdminPlayers.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none">기록 보기</a></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center"><span style="background: #F9FAFB; border-radius: 14px; padding: 10px 0"><b style="display: block; font-size: 18px; font-weight: 900; color: #B45309">4/12</b><span style="font-size: 12px; color: #6B7280">출석</span></span><span style="background: #F9FAFB; border-radius: 14px; padding: 10px 0"><b style="display: block; font-size: 18px; font-weight: 900">0</b><span style="font-size: 12px; color: #6B7280">지각</span></span><span style="background: #F9FAFB; border-radius: 14px; padding: 10px 0"><b style="display: block; font-size: 18px; font-weight: 900; color: #B91C1C">1</b><span style="font-size: 12px; color: #6B7280">무단 결석</span></span></div><span style="font-size: 12px; color: #6B7280">최근 4번 연속 불참이에요</span></div>
    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; gap: 0"><div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px"><b style="font-size: 15px">회비와 벌금</b><a href="DuesAdmin.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none">회비에서 보기</a></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px"><span>10월 회비 <span style="color: #6B7280"></span></span><b style="color: #B91C1C">미납</b></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px"><span>11월 회비 <span style="color: #6B7280"></span></span><b style="color: #B91C1C">미납</b></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px"><span>무단 결석 벌금 <span style="color: #6B7280">10.18</span></span><b style="color: #B91C1C">미납</b></div><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px"><span>9월 회비 <span style="color: #6B7280"></span></span><b style="color: #166534">납부</b></div><div style="display: flex; justify-content: space-between; padding-top: 10px; font-size: 14px"><b>밀린 돈</b><b style="color: #B91C1C">70,000원</b></div></div>
    <section style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 900; color: #6B7280; display: flex; justify-content: space-between">포지션<span style="font-weight: 500"></span></span><div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 700"><a href="#" style="{{ c1_0s }}" onClick="{{ c1_0k }}">GK</a><a href="#" style="{{ c1_1s }}" onClick="{{ c1_1k }}">DF</a><a href="#" style="{{ c1_2s }}" onClick="{{ c1_2k }}">LW</a><a href="#" style="{{ c1_3s }}" onClick="{{ c1_3k }}">RW</a><a href="#" style="{{ c1_4s }}" onClick="{{ c1_4k }}">FW</a></div><span style="font-size: 12px; color: #6B7280">누르면 바로 바뀌고 다음 라인업부터 반영돼요</span></section>

    <a href="PlayersAdminRemove.dc.html" style="font-size: 14px; color: #B91C1C; text-align: center; text-decoration: none; padding: 12px 0; font-weight: 700">팀에서 내보내기</a>
  </div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D","options":["#15803D","#1E6B45","#2563EB","#111827"]},"$preview":{"width":390,"height":1440}}'>
class Component extends DCLogic {
  renderVals() { /*maniball-interactive*/
    const A = this.props.accent ?? '#15803D';
    const S = this.state || {};
    const T = [{"id": "c1", "k": "sel", "multi": false, "sel": 1, "els": [{"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}, {"on": "text-decoration: none; background: {{accent}}; color: #FFFFFF; border-radius: 999px; padding: 9px 14px", "off": "text-decoration: none; background: #FFFFFF; border: 1px solid #E5E7EB; color: #111827; border-radius: 999px; padding: 9px 14px"}], "labs": ["GK", "DF", "LW", "RW", "FW"]}];
    const fix = (x) => String(x == null ? '' : x).split('{{accent}}').join(A);
    const set = (o) => this.setState(o);
    const pd = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    const get = (k, d) => (S[k] === undefined ? d : S[k]);
    const v = { accent: A, toastOn: !!S._toast, toastText: S._toast || '' };
    const toast = (m) => { set({ _toast: m }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ _toast: '' }), 1800); };
    const byId = {};
    T.forEach((c) => { byId[c.id] = c; });
    T.forEach((c) => {
      const k = c.id;
      if (c.k === 'sel') {
        const cur = get(k, c.sel);
        c.els.forEach((e, i) => {
          const on = c.multi ? cur.indexOf(i) >= 0 : cur === i;
          v[k + '_' + i + 's'] = fix(on ? e.on : e.off);
          v[k + '_' + i + 'k'] = (ev) => {
            pd(ev);
            if (c.multi) { const a = cur.slice(); const j = a.indexOf(i); if (j >= 0) a.splice(j, 1); else a.push(i); set({ [k]: a }); }
            else set({ [k]: i });
          };
        });
      } else if (c.k === 'tog') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 'n'] = on ? c.non : c.noff;
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'chk') {
        const on = get(k, c.on);
        v[k + 's'] = fix(on ? c.son : c.soff); v[k + 't'] = on ? '✓' : '';
        v[k + 'k'] = (ev) => { pd(ev); set({ [k]: !on }); };
      } else if (c.k === 'step') {
        const n = get(k, c.val);
        v[k + 't'] = n + c.suf;
        if (c.bst !== undefined) v[k + 'bs'] = c.bst.replace(/color: #(D1D5DB|111827)/, 'color: ' + (n ? '#111827' : '#D1D5DB'));
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: Math.max(0, n - 1) }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: n + 1 }); };
      } else if (c.k === 'field') {
        v[k + 'v'] = get(k, c.val);
        v[k + 'c'] = (ev) => set({ [k]: ev && ev.target ? ev.target.value : '' });
      } else if (c.k === 'month') {
        const off = get(k, 0); let y = c.y, m = c.m + off;
        while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
        v[k + 't'] = y + '년 ' + m + '월';
        v[k + 'm'] = (ev) => { pd(ev); set({ [k]: off - 1 }); };
        v[k + 'p'] = (ev) => { pd(ev); set({ [k]: off + 1 }); };
      } else if (c.k === 'act') {
        const done = get(k, 0);
        if (c.a === 'toast') v[k + 'k'] = (ev) => { pd(ev); toast(c.msg); };
        if (c.a === 'copy') {
          v[k + 't'] = done ? '복사했어요' : c.label;
          v[k + 'k'] = (ev) => {
            pd(ev);
            let t = c.text;
            if (c.codeFrom) t = t.replace(/maniball\.app\/j\/\w+/, 'maniball.app/j/' + get(c.codeFrom, 'TEST7Q'));
            try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) {}
            set({ [k]: 1 }); toast('복사했어요');
            setTimeout(() => this.setState({ [k]: 0 }), 1600);
          };
        }
        if (c.a === 'share') v[k + 'k'] = (ev) => {
          if (!c.nav) pd(ev);
          try { if (navigator.share) { navigator.share({ title: 'TEST FS', text: get('_msg', 'TEST FS 팀 관리 앱이에요. 링크 누르고 들어와요!'), url: 'https://maniball.app/j/TEST7Q' }).catch(() => {}); } } catch (e) {}
          toast('공유 창을 열었어요');
        };
        if (c.a === 'hide') { v[k + 'r'] = c.rs + (done ? '; display: none' : ''); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast(c.msg); }; }
        if (c.a === 'got') { v[k + 's'] = done ? c.s1 : c.s0; v[k + 't'] = done ? '받음 완료' : '받음'; v[k + 'k'] = (ev) => { pd(ev); if (!done) { set({ [k]: 1 }); toast('현금으로 받은 걸로 처리했어요'); } }; }
        if (c.a === 'link') { v[k + 't'] = get(k, c.code); v[k + 'k'] = (ev) => { pd(ev); set({ [k]: Math.random().toString(36).slice(2, 8).toUpperCase() }); toast('새 링크를 만들었어요. 예전 링크는 막혔어요'); }; }
        if (c.a === 'readall') {
          (c.rows || []).forEach((r, i) => { v[k + '_' + i + 'r'] = done ? r.replace('background: #F0FDF4', 'background: #FFFFFF') : r; });
          (c.dots || []).forEach((d, i) => { v[k + '_' + i + 'd'] = done ? d.replace('background: #DC2626', 'background: transparent') : d; });
          v[k + 't'] = done ? '0개' : (c.cnt || '');
          v[k + 'k'] = (ev) => { pd(ev); set({ [k]: 1 }); toast('모두 읽음으로 바꿨어요'); };
        }
        if (c.a === 'photo') {
          const url = get(k, '');
          v[k + 'ps'] = fix(c.ts) + (url ? '; background: center / cover no-repeat url(' + url + ')' : '');
          v[k + 'sv'] = url ? 'display: none' : '';
          v[k + 'pt'] = url ? '' : (c.pt || '');
          v[k + 'c'] = (ev) => { const f = ev && ev.target && ev.target.files && ev.target.files[0]; if (f) { set({ [k]: URL.createObjectURL(f) }); toast('사진을 바꿨어요'); } };
        }
        if (c.a === 'selectall') v[k + 'k'] = (ev) => { pd(ev); const o = {}; T.forEach((x) => { if (x.k === 'chk') o[x.id] = true; }); set(o); toast('모두 골랐어요'); };
        if (c.a === 'edit') v[k + 'k'] = (ev) => { pd(ev); set({ _edit: !get('_edit', false) }); };
      }
    });
    const val = (id) => (byId[id] && byId[id].k === 'field' ? get(id, byId[id].val) : '');
    const pick = (id) => { const c = byId[id]; if (!c) return ''; const i = get(id, c.sel); return c.multi ? i.map((x) => c.labs[x]) : (i >= 0 ? c.labs[i] : ''); };
    const chk = (id) => { const c = byId[id]; return c ? get(id, c.on) : false; };


    return v;
  }
}
</script>
