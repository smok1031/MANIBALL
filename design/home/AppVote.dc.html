<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예시 화면 참석 집계</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="참석 인원이 자동으로 집계되고 미응답자가 따로 보이는 화면 예시" style="width: 320px; height: 660px; box-sizing: border-box; border-radius: 44px; background: #111111; padding: 10px; font-family: 'Noto Sans KR', sans-serif; color: #111827; box-shadow: 0 24px 50px rgba(0,0,0,0.18)">
  <div style="width: 100%; height: 100%; border-radius: 34px; background: #F6F7F9; overflow: hidden; display: flex; flex-direction: column">
    <div style="padding: 26px 18px 10px">
      <div style="font-size: 11px; color: #6B7280; font-weight: 700">11.15 토 08:00 한강 축구장</div>
      <b style="font-size: 20px; font-weight: 900">참석 현황</b>
    </div>
    <div style="margin: 0 14px; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <b style="font-size: 14px">참석 확정</b>
        <span style="font-size: 28px; font-weight: 900">14<span style="font-size: 13px; color: #9CA3AF"> / 정원 14</span></span>
      </div>
      <div style="height: 8px; border-radius: 999px; background: #E5E7EB; overflow: hidden"><div style="width: 100%; height: 100%; background: {{accent}}"></div></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center">
        <span style="background: #F3F4F6; border-radius: 10px; padding: 7px 0; font-size: 11px; color: #4B5563"><b style="display: block; font-size: 16px; color: #111827">1</b>대기</span>
        <span style="background: #F3F4F6; border-radius: 10px; padding: 7px 0; font-size: 11px; color: #4B5563"><b style="display: block; font-size: 16px; color: #111827">2</b>늦참</span>
        <span style="background: #F3F4F6; border-radius: 10px; padding: 7px 0; font-size: 11px; color: #4B5563"><b style="display: block; font-size: 16px; color: #111827">3</b>불참</span>
        <span style="background: #FEF2F2; border-radius: 10px; padding: 7px 0; font-size: 11px; color: #B91C1C"><b style="display: block; font-size: 16px">5</b>미응답</span>
      </div>
      <div style="font-size: 11px; color: #6B7280">늦참 2명: 최하준 2Q부터, 황민재 3Q부터</div>
    </div>
    <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <b style="font-size: 14px">아직 안 누른 사람 5명</b>
      <div style="display: flex; flex-wrap: wrap; gap: 5px">
        <span style="font-size: 12px; background: #FEF2F2; color: #991B1B; border-radius: 999px; padding: 4px 9px">오태윤</span>
        <span style="font-size: 12px; background: #FEF2F2; color: #991B1B; border-radius: 999px; padding: 4px 9px">신재원</span>
        <span style="font-size: 12px; background: #FEF2F2; color: #991B1B; border-radius: 999px; padding: 4px 9px">임건우</span>
        <span style="font-size: 12px; background: #FEF2F2; color: #991B1B; border-radius: 999px; padding: 4px 9px">조현우</span>
        <span style="font-size: 12px; background: #FEF2F2; color: #991B1B; border-radius: 999px; padding: 4px 9px">한유찬</span>
      </div>
      <span style="background: {{accent}}; color: #FFFFFF; border-radius: 12px; padding: 11px 0; text-align: center; font-weight: 700; font-size: 13px">미응답자에게 보낼 문구 복사</span>
      <span style="font-size: 11px; color: #6B7280; text-align: center">이름이 들어간 안내 문구를 단톡방에 붙여 넣기만 하면 돼요</span>
    </div>
    <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px">
      <span><b>대기 1번</b> <span style="color: #6B7280">강시우</span></span>
      <span style="color: #6B7280">취소가 나오면 자동으로 올라가요</span>
    </div>
    <div style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #E5E7EB; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 6px 18px; font-size: 11px; color: #6B7280; text-align: center">
      <span style="color: {{accent}}; font-weight: 700">홈</span><span>일정</span><span>회비</span><span>선수</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D"},"$preview":{"width":320,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#15803D' };
  }
}
</script>
</body>
</html>
