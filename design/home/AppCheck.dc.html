<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예시 화면 현장 출석과 벌금</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="현장에서 출석을 체크하면 지각과 결석 벌금이 자동으로 붙는 화면 예시" style="width: 320px; height: 660px; box-sizing: border-box; border-radius: 44px; background: #111111; padding: 10px; font-family: 'Noto Sans KR', sans-serif; color: #111827; box-shadow: 0 24px 50px rgba(0,0,0,0.18)">
  <div style="width: 100%; height: 100%; border-radius: 34px; background: #F6F7F9; overflow: hidden; display: flex; flex-direction: column">
    <div style="padding: 26px 18px 10px; display: flex; justify-content: space-between; align-items: flex-end">
      <div><div style="font-size: 11px; color: #6B7280; font-weight: 700">11.15 토 08:00 킥오프</div><b style="font-size: 20px; font-weight: 900">현장 출석</b></div>
      <span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #111827; border-radius: 999px; padding: 4px 9px">운영진</span>
    </div>
    <div style="margin: 0 14px; background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #6B7280"><span>기준 07:50 (10분 전)</span><span>지금 08:04</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; text-align: center">
        <span style="background: #F0FDF4; border-radius: 10px; padding: 7px 0; font-size: 11px; color: #166534"><b style="display: block; font-size: 16px">12</b>출석</span>
        <span style="background: #FFFBEB; border-radius: 10px; padding: 7px 0; font-size: 11px; color: #92400E"><b style="display: block; font-size: 16px">2</b>지각</span>
        <span style="background: #FEF2F2; border-radius: 10px; padding: 7px 0; font-size: 11px; color: #B91C1C"><b style="display: block; font-size: 16px">1</b>결석</span>
      </div>
    </div>
    <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px"><b>김민준</b><span style="background: {{accent}}; color: #FFFFFF; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 11px">출석 07:41</span></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px"><b>이서준</b><span style="background: {{accent}}; color: #FFFFFF; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 11px">출석 07:46</span></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px"><b>정우진</b><span style="background: #FEF3C7; color: #92400E; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 11px">지각 07:58</span></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px"><b>박도윤</b><span style="background: #FEF3C7; color: #92400E; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 11px">지각 08:03</span></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px"><b>유승호</b><span style="background: #FEE2E2; color: #B91C1C; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 11px">결석</span></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 0; font-size: 13px"><b>최하준</b><span style="color: #6B7280; font-size: 11px">늦참 신고, 2Q부터</span></div>
    </div>
    <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
      <b style="font-size: 14px">팀 규칙대로 계산했어요</b>
      <div style="display: flex; justify-content: space-between; font-size: 12px"><span>정우진 <span style="color: #6B7280">지각</span></span><b>2,000원</b></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px"><span>박도윤 <span style="color: #6B7280">지각</span></span><b>2,000원</b></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px"><span>유승호 <span style="color: #6B7280">무단 결석</span></span><b>10,000원</b></div>
    </div>
    <span style="margin: 10px 14px 0; background: {{accent}}; color: #FFFFFF; border-radius: 12px; padding: 11px 0; text-align: center; font-weight: 700; font-size: 13px">벌금 부과하고 공유</span>
    <div style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #E5E7EB; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 6px 18px; font-size: 11px; color: #6B7280; text-align: center">
      <span>홈</span><span style="color: {{accent}}; font-weight: 700">일정</span><span>회비</span><span>선수</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D"},"$preview":{"width":320,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#15803D' };
  }
}
</script>
</body>
</html>
