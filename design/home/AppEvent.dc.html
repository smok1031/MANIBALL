<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예시 화면 공지와 MOM</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="고정 공지, 회식 날짜 설문, 오늘의 MOM 투표가 한 화면에 있는 예시" style="width: 320px; height: 660px; box-sizing: border-box; border-radius: 44px; background: #111111; padding: 10px; font-family: 'Noto Sans KR', sans-serif; color: #111827; box-shadow: 0 24px 50px rgba(0,0,0,0.18)">
  <div style="width: 100%; height: 100%; border-radius: 34px; background: #F6F7F9; overflow: hidden; display: flex; flex-direction: column">
    <div style="padding: 26px 18px 10px">
      <div style="font-size: 11px; color: #6B7280; font-weight: 700">TEST FC</div>
      <b style="font-size: 20px; font-weight: 900">팀 소식</b>
    </div>
    <div style="margin: 0 14px; background: #111827; color: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 700; color: #FDE68A">고정 공지</span>
      <b style="font-size: 14px">12월부터 경기장이 바뀌어요</b>
      <span style="font-size: 12px; color: #D1D5DB; line-height: 1.5">토요일 08:00 잠실 보조구장, 주차는 2시간 무료예요.</span>
      <span style="font-size: 11px; color: #9CA3AF">21명 읽음</span>
    </div>
    <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 14px">송년회 날짜 설문</b><span style="font-size: 11px; color: #6B7280">17명 참여</span></div>
      <div style="font-size: 12px; display: flex; flex-direction: column; gap: 3px"><div style="display: flex; justify-content: space-between"><span>12.19 금</span><b>9</b></div><div style="height: 6px; border-radius: 999px; background: #E5E7EB; overflow: hidden"><div style="width: 53%; height: 100%; background: {{accent}}"></div></div></div>
      <div style="font-size: 12px; display: flex; flex-direction: column; gap: 3px"><div style="display: flex; justify-content: space-between"><span>12.20 토</span><b>6</b></div><div style="height: 6px; border-radius: 999px; background: #E5E7EB; overflow: hidden"><div style="width: 35%; height: 100%; background: {{accent}}; opacity: 0.55"></div></div></div>
      <div style="font-size: 12px; display: flex; flex-direction: column; gap: 3px"><div style="display: flex; justify-content: space-between"><span>12.26 금</span><b>2</b></div><div style="height: 6px; border-radius: 999px; background: #E5E7EB; overflow: hidden"><div style="width: 12%; height: 100%; background: {{accent}}; opacity: 0.55"></div></div></div>
    </div>
    <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 14px">11.15 오늘의 MOM</b><span style="font-size: 11px; color: #6B7280">익명, 오늘 22시 마감</span></div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">1</span><b style="flex: 1">정우진</b><span style="color: #6B7280; font-size: 12px">2골</span><b>6표</b></div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #E5E7EB; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">2</span><b style="flex: 1">윤지호</b><span style="color: #6B7280; font-size: 12px">GK</span><b>4표</b></div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 50%; background: #E5E7EB; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">3</span><b style="flex: 1">박도윤</b><span style="color: #6B7280; font-size: 12px">1도움</span><b>3표</b></div>
      <span style="background: {{accent}}; color: #FFFFFF; border-radius: 12px; padding: 10px 0; text-align: center; font-weight: 700; font-size: 13px">나도 투표하기</span>
    </div>
    <div style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #E5E7EB; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 6px 18px; font-size: 11px; color: #6B7280; text-align: center">
      <span style="color: {{accent}}; font-weight: 700">홈</span><span>일정</span><span>회비</span><span>선수</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803D"},"$preview":{"width":320,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#15803D' };
  }
}
</script>
</body>
</html>
